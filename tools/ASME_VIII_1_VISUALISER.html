<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codewise · ASME VIII Learning Lab</title>
<meta name="description" content="Interactive learning aid for ASME BPVC Section VIII Division 1 (2025 edition).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script>
  /* Theme bootstrap: runs before paint to avoid a flash. Respects system preference unless the user chose. */
  (function () {
    var t = null;
    try { t = localStorage.getItem('cw-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
/* =========================================================================
   DESIGN TOKENS
   Concept colours are used everywhere a concept appears:
   --c-pressure (blue), --c-stress (amber), --c-geom (teal: thickness/geometry),
   --c-corr (rose: corrosion allowance), --c-ok / --c-warn / --c-bad (status)
   ========================================================================= */
:root {
  --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px;
  --ease: cubic-bezier(.2,.7,.2,1);
  --header-h: 60px; --footer-h: 34px;
}
:root[data-theme="dark"] {
  --bg: #0A0C10; --bg-2: #0F1218; --surface: #131720; --surface-2: #181D28; --surface-3: #1F2533;
  --line: #242B3A; --line-2: #2F3849;
  --text: #E8ECF3; --text-2: #A3ADBF; --text-3: #6F7A8E;
  --accent: #8B7CFF; --accent-soft: rgba(139,124,255,.14);
  --c-pressure: #5B9BFF; --c-pressure-soft: rgba(91,155,255,.14);
  --c-stress: #F5A524;   --c-stress-soft: rgba(245,165,36,.14);
  --c-geom: #2DD4BF;     --c-geom-soft: rgba(45,212,191,.14);
  --c-corr: #FB7185;     --c-corr-soft: rgba(251,113,133,.14);
  --c-ok: #34D399; --c-ok-soft: rgba(52,211,153,.13);
  --c-warn: #FBBF24; --c-warn-soft: rgba(251,191,36,.13);
  --c-bad: #F87171; --c-bad-soft: rgba(248,113,113,.14);
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px -12px rgba(0,0,0,.6);
  --shadow-lg: 0 30px 80px -20px rgba(0,0,0,.75);
  --grid: rgba(255,255,255,.035);
  --canvas-bg: #0D1017;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F7F8FA; --bg-2: #F0F2F5; --surface: #FFFFFF; --surface-2: #F7F8FB; --surface-3: #EEF1F6;
  --line: #E3E7EE; --line-2: #D4DAE4;
  --text: #0E1420; --text-2: #4A5568; --text-3: #6B7588;
  --accent: #5B4BDB; --accent-soft: rgba(91,75,219,.10);
  --c-pressure: #1F6FEB; --c-pressure-soft: rgba(31,111,235,.10);
  --c-stress: #B45309;   --c-stress-soft: rgba(217,119,6,.12);
  --c-geom: #0F8A7E;     --c-geom-soft: rgba(15,138,126,.10);
  --c-corr: #D02F4E;     --c-corr-soft: rgba(208,47,78,.10);
  --c-ok: #0E8A5F; --c-ok-soft: rgba(14,138,95,.10);
  --c-warn: #A86400; --c-warn-soft: rgba(217,145,0,.13);
  --c-bad: #C62828; --c-bad-soft: rgba(198,40,40,.10);
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 8px 24px -12px rgba(16,24,40,.14);
  --shadow-lg: 0 30px 80px -20px rgba(16,24,40,.3);
  --grid: rgba(15,20,32,.045);
  --canvas-bg: #EEF1F6;
  color-scheme: light;
}

/* ----------------------------- base ----------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15.5px/1.6 var(--font); font-feature-settings: 'cv11','ss01';
  -webkit-font-smoothing: antialiased; padding-bottom: var(--footer-h);
  transition: background .25s var(--ease), color .25s var(--ease);
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
h1,h2,h3,h4 { letter-spacing: -.02em; margin: 0; line-height: 1.2; }
p { margin: 0 0 .8em; }
code, .mono { font-family: var(--mono); font-size: .92em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--accent-soft); }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.muted { color: var(--text-2); } .dim { color: var(--text-3); }
.c-pressure { color: var(--c-pressure); } .c-stress { color: var(--c-stress); }
.c-geom { color: var(--c-geom); } .c-corr { color: var(--c-corr); }

/* ----------------------------- header ----------------------------- */
.hdr {
  position: sticky; top: 0; z-index: 50; height: var(--header-h);
  display: flex; align-items: center; gap: 16px; padding: 0 24px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(160%) blur(14px); -webkit-backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  background: linear-gradient(140deg, var(--c-pressure), var(--accent) 55%, var(--c-geom)); color: #fff; box-shadow: 0 6px 18px -6px var(--accent); }
.brand small { font-weight: 500; color: var(--text-3); font-size: 12.5px; margin-left: 2px; }
.hdr-nav { display: flex; gap: 2px; margin-left: 8px; }
.hdr-nav a { padding: 6px 10px; border-radius: 8px; color: var(--text-2); font-size: 14px; font-weight: 500; }
.hdr-nav a:hover, .hdr-nav a.active { color: var(--text); background: var(--surface-2); }
.hdr-spacer { flex: 1; }
.kbtn { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px 0 12px; min-width: 240px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; color: var(--text-3); cursor: pointer;
  font-size: 14px; transition: border-color .15s, background .15s; }
.kbtn:hover { border-color: var(--line-2); color: var(--text-2); }
.kbtn span.grow { flex: 1; text-align: left; }
kbd { font-family: var(--mono); font-size: 11.5px; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line-2);
  background: var(--surface-2); color: var(--text-2); }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; color: var(--text-2); transition: all .15s; }
.icon-btn:hover { color: var(--text); border-color: var(--line-2); }
.icon-btn svg { width: 18px; height: 18px; }

/* ----------------------------- footer ----------------------------- */
.ftr { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; height: var(--footer-h);
  display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px;
  font-size: 12px; color: var(--text-3); background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); text-align: center; }
.ftr svg { width: 14px; height: 14px; flex: none; color: var(--c-warn); }
.ftr b { color: var(--text-2); font-weight: 600; }

/* ----------------------------- layout ----------------------------- */
main { min-height: calc(100vh - var(--header-h) - var(--footer-h)); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
.view { animation: viewIn .35s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }

/* ----------------------------- home ----------------------------- */
.hero { position: relative; z-index: 20; isolation: isolate; padding: 76px 0 44px; text-align: center; }
.hero-bg { position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.hero-bg::before { content: ''; position: absolute; inset: 0;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 44px 44px; mask-image: radial-gradient(ellipse 70% 70% at 50% 30%, #000 30%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 30%, #000 30%, transparent 75%); }
.hero-bg::after { content: ''; position: absolute; left: 50%; top: -180px; width: 900px; height: 500px; transform: translateX(-50%);
  background: radial-gradient(closest-side, var(--accent-soft), transparent); filter: blur(10px); }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; color: var(--text-2); font-weight: 500; }
.eyebrow .pill { padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.hero h1 { font-size: clamp(34px, 5vw, 56px); font-weight: 700; letter-spacing: -.035em; margin: 22px auto 14px; max-width: 840px; }
.hero h1 .grad { background: linear-gradient(100deg, var(--c-pressure), var(--accent) 50%, var(--c-geom)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p.lead { font-size: 18px; color: var(--text-2); max-width: 640px; margin: 0 auto 30px; }
.searchbox { position: relative; z-index: 60; max-width: 640px; margin: 0 auto; text-align: left; }
.searchbox .field { display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 14px 0 18px; border-radius: 16px;
  background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
.searchbox .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
.searchbox svg { width: 20px; height: 20px; color: var(--text-3); flex: none; }
.searchbox input { flex: 1; height: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font: 500 17px var(--font); }
.searchbox input::placeholder { color: var(--text-3); font-weight: 400; }
.search-pop { position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 60; background: var(--surface); border: 1px solid var(--line-2);
  border-radius: 14px; box-shadow: var(--shadow-lg); padding: 6px; display: none; max-height: min(460px, 62vh); overflow: auto; }
.search-pop.open { display: block; animation: viewIn .18s var(--ease); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-size: 13px; color: var(--text-2); cursor: pointer; transition: all .15s; }
.chip:hover { color: var(--text); border-color: var(--line-2); transform: translateY(-1px); }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.section-h { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin: 54px 0 18px; }
.section-h h2 { font-size: 22px; font-weight: 650; }
.section-h p { margin: 4px 0 0; color: var(--text-2); font-size: 14.5px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--text-2); cursor: pointer; transition: all .15s; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 0 0 1px var(--line-2); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.card { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); cursor: pointer;
  transition: transform .2s var(--ease), border-color .2s, box-shadow .2s; overflow: hidden; min-height: 190px; }
.card:hover { transform: translateY(-3px); border-color: var(--line-2); }
.card.live::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 2px; background: linear-gradient(90deg, var(--c-pressure), var(--accent), var(--c-geom)); }
.card .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.para-id { font-family: var(--mono); font-weight: 600; font-size: 13px; padding: 3px 8px; border-radius: 7px; background: var(--surface-3); color: var(--text); }
.badge { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; letter-spacing: .01em; white-space: nowrap; }
.badge.live { background: var(--c-ok-soft); color: var(--c-ok); }
.badge.soon { background: var(--surface-3); color: var(--text-3); }
.card h3 { font-size: 17px; font-weight: 620; }
.card p { font-size: 14px; color: var(--text-2); margin: 0; }
.card .meta { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--text-3); }
.card .art { position: absolute; right: -10px; bottom: -14px; width: 120px; height: 120px; opacity: .14; pointer-events: none; }
.card.soon { cursor: pointer; }
.card.soon h3, .card.soon p { opacity: .8; }

.browse { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 18px 18px 14px; }
.panel h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 600; margin-bottom: 12px; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul { margin-left: 13px; padding-left: 14px; border-left: 1px dashed var(--line-2); }
.tree li { margin: 2px 0; }
.tree .node { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 6px 8px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; font-size: 14px; color: var(--text-2); }
.tree .node:hover { background: var(--surface-2); color: var(--text); }
.tree .node .caret { width: 14px; height: 14px; transition: transform .18s; color: var(--text-3); flex: none; }
.tree li[aria-expanded="false"] > ul { display: none; }
.tree li[aria-expanded="false"] > .node .caret { transform: rotate(-90deg); }
.tree .leaf { font-family: var(--mono); font-size: 13px; }
.tree .leaf .t { font-family: var(--font); color: var(--text-3); font-size: 13px; }
.tree .node .grow { flex: 1; }
.tree .disabled { opacity: .5; cursor: default; }
.cat-list { display: grid; gap: 8px; }
.cat { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; transition: all .15s; text-align: left; width: 100%; }
.cat:hover, .cat[aria-pressed="true"] { border-color: var(--line-2); background: var(--surface-3); }
.cat .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.cat .ic svg { width: 18px; height: 18px; }
.cat b { font-weight: 600; font-size: 14px; display: block; }
.cat small { color: var(--text-3); font-size: 12.5px; }
.cat .count { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--text-3); }

/* ----------------------------- palette ----------------------------- */
.pal-back { position: fixed; inset: 0; z-index: 100; background: rgba(5,7,12,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: none; align-items: flex-start; justify-content: center; padding: 12vh 16px 0; }
.pal-back.open { display: flex; animation: fadeIn .15s var(--ease); }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.pal { width: 100%; max-width: 640px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; animation: palIn .2s var(--ease); }
@keyframes palIn { from { transform: translateY(-8px) scale(.985); opacity: 0 } to { transform: none; opacity: 1 } }
.pal-in { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 56px; border-bottom: 1px solid var(--line); }
.pal-in svg { width: 18px; height: 18px; color: var(--text-3); }
.pal-in input { flex: 1; height: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font: 500 16px var(--font); }
.pal-list { max-height: 400px; overflow: auto; padding: 6px; }
.pal-group { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); padding: 10px 10px 4px; font-weight: 600; }
.res { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px; cursor: pointer; }
.res[aria-selected="true"] { background: var(--surface-3); }
.res .ri { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); flex: none; color: var(--text-2); }
.res .ri svg { width: 15px; height: 15px; }
.res .rt { flex: 1; min-width: 0; }
.res .rt b { display: block; font-weight: 550; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res .rt small { color: var(--text-3); font-size: 12.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res mark { background: transparent; color: var(--accent); font-weight: 650; }
.res .go { color: var(--text-3); font-size: 12px; }
.pal-foot { display: flex; gap: 16px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-3); background: var(--surface-2); }
.pal-empty { padding: 30px; text-align: center; color: var(--text-3); font-size: 14px; }

/* ----------------------------- topic page ----------------------------- */
.topic { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; padding-top: 26px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--text-3); margin-bottom: 14px; }
.crumbs a:hover { color: var(--text); }
.crumbs .sep { opacity: .5; }
.crumbs .cur { color: var(--text-2); font-weight: 500; }
.toc { position: sticky; top: calc(var(--header-h) + 26px); align-self: start; max-height: calc(100vh - var(--header-h) - 80px); overflow: auto; }
.toc h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); margin: 6px 0 10px 12px; font-weight: 600; }
.toc a { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 8px; font-size: 14px; color: var(--text-2); border-left: 2px solid transparent; transition: all .15s; }
.toc a .n { font-family: var(--mono); font-size: 11px; color: var(--text-3); width: 16px; }
.toc a:hover { color: var(--text); background: var(--surface-2); }
.toc a.active { color: var(--text); background: var(--surface-2); border-left-color: var(--accent); }
.toc .toc-mini { margin-top: 18px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; font-size: 12.5px; color: var(--text-3); background: var(--surface); }
.toc .toc-mini b { color: var(--text-2); }
.legend-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.legend-row i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.t-head { padding-bottom: 26px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.t-head .ids { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.t-head h1 { font-size: clamp(28px, 3.4vw, 40px); font-weight: 700; letter-spacing: -.03em; }
.t-head .sub { color: var(--text-2); font-size: 17px; margin-top: 10px; max-width: 760px; }
.sec { padding: 40px 0 8px; scroll-margin-top: calc(var(--header-h) + 10px); }
.sec > .sh { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
.sec > .sh .snum { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 600; }
.sec > .sh h2 { font-size: 24px; font-weight: 680; }
.sec .intro { font-size: 16.5px; color: var(--text-2); max-width: 780px; }
.prose { max-width: 780px; }
.prose p { color: var(--text-2); }
.prose strong { color: var(--text); font-weight: 600; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow); }
.box h3 { font-size: 16px; font-weight: 620; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
.box p { color: var(--text-2); font-size: 14.5px; }
.box p:last-child { margin-bottom: 0; }
.ic-dot { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.ic-dot svg { width: 16px; height: 16px; }
.why { display: flex; gap: 14px; padding: 16px 18px; border-radius: var(--r-md); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); margin-top: 18px; max-width: 780px; }
.why svg { width: 20px; height: 20px; color: var(--accent); flex: none; margin-top: 2px; }
.why p { margin: 0; color: var(--text); font-size: 14.5px; }
.fig { margin: 0; }
.fig svg { width: 100%; height: auto; display: block; }
.fig figcaption { font-size: 12.5px; color: var(--text-3); margin-top: 8px; }

/* formula */
.ftabs { margin-bottom: 14px; }
.fcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.fcard-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--surface-2); flex-wrap: wrap; }
.fcard-top b { font-weight: 600; }
.fcard-top .ref { font-family: var(--mono); font-size: 12.5px; color: var(--text-3); }
.feq { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 34px 20px 28px; font-size: 1.55em; }
.feq .or { font-size: 13px; color: var(--text-3); text-transform: uppercase; letter-spacing: .1em; text-align: center; }
.feq .eq { text-align: center; }
.feq .eqlab { display: block; font-size: 11.5px; color: var(--text-3); font-family: var(--font); margin-top: 10px; letter-spacing: .02em; }
.limits { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 20px 18px; border-top: 1px dashed var(--line); align-items: center; }
.limits .lbl { font-size: 12.5px; color: var(--text-3); margin-right: 4px; }
.lim { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 13.5px; }
.lim .st { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
.lim.ok .st { background: var(--c-ok-soft); color: var(--c-ok); }
.lim.bad { border-color: color-mix(in srgb, var(--c-bad) 45%, transparent); background: var(--c-bad-soft); }
.lim.bad .st { background: var(--c-bad); color: #fff; }
.fnote { padding: 0 20px 18px; font-size: 13px; color: var(--text-3); }
.katex .v { cursor: help; border-radius: 4px; transition: background .12s; padding: 0 1px; }
.katex .v:hover, .katex .v.hl { background: var(--surface-3); }
.katex .v-P { color: var(--c-pressure); } .katex .v-S { color: var(--c-stress); }
.katex .v-R, .katex .v-t { color: var(--c-geom); } .katex .v-E { color: var(--accent); }
.vars { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 16px; }
.var { padding: 14px 16px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); cursor: default; transition: border-color .15s, transform .15s; }
.var.hl, .var:hover { border-color: var(--line-2); transform: translateY(-1px); }
.var .sym { font: 600 20px/1 var(--mono); margin-bottom: 8px; display: flex; align-items: baseline; gap: 8px; }
.var .sym small { font: 500 12px var(--font); color: var(--text-3); }
.var p { margin: 0 0 6px; font-size: 13.5px; color: var(--text-2); }
.var .src { font-size: 12px; color: var(--text-3); }
.var .src code { color: var(--text-2); }
.tip { position: fixed; z-index: 120; max-width: 300px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow-lg); font-size: 13px; color: var(--text-2); pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }
.tip.show { opacity: 1; transform: none; }
.tip b { color: var(--text); font-family: var(--mono); font-size: 15px; }
.tip .u { float: right; font-family: var(--mono); font-size: 11.5px; color: var(--text-3); margin-left: 12px; }

/* lab */
.lab { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 0; border: 1px solid var(--line); border-radius: var(--r-xl); overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
.stage { position: relative; min-height: 560px; background: radial-gradient(ellipse at 50% 40%, color-mix(in srgb, var(--canvas-bg) 70%, var(--surface-3)), var(--canvas-bg)); }
.stage canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; outline: none; }
.stage .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-3); font-size: 13px; }
.s-tools { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; flex-wrap: wrap; gap: 8px; z-index: 2; pointer-events: none; }
.s-tools > * { pointer-events: auto; }
.s-tools .seg { background: color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.tgl { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 85%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 13px; font-weight: 500; color: var(--text-2); cursor: pointer; transition: all .15s; }
.tgl:hover { color: var(--text); }
.tgl[aria-pressed="true"] { color: var(--text); border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: var(--accent-soft); }
.tgl svg { width: 15px; height: 15px; }
.s-legend { position: absolute; left: 14px; bottom: 14px; z-index: 2; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 12px; color: var(--text-2); }
.s-readout { position: absolute; right: 14px; bottom: 14px; z-index: 2; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 12px; color: var(--text-3); text-align: right; }
.s-readout b { display: block; font: 600 20px var(--mono); color: var(--c-geom); }
.s-hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); font-size: 11.5px; color: var(--text-3); z-index: 1; white-space: nowrap; }
.ctrl { border-left: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 14px; background: var(--surface); }
.ctrl-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ctrl-top h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); font-weight: 600; }
.inp { display: grid; gap: 6px; }
.inp-h { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.inp-h .sym { font: 600 14px var(--mono); width: 22px; }
.inp-h .nm { color: var(--text-2); flex: 1; }
.num { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); height: 30px; transition: border-color .15s; }
.num:focus-within { border-color: var(--accent); }
.num input { width: 78px; border: 0; outline: 0; background: transparent; color: var(--text); font: 500 13.5px var(--mono); text-align: right; padding: 0 4px 0 8px; }
.num span { font: 12px var(--mono); color: var(--text-3); padding-right: 8px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; cursor: pointer; --fill: 50%; --col: var(--accent); }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--col) var(--fill), var(--surface-3) var(--fill)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--col) var(--fill), var(--surface-3) var(--fill)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; margin-top: -6px; background: #fff; border: 2px solid var(--col); box-shadow: 0 1px 4px rgba(0,0,0,.35); transition: transform .12s; }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid var(--col); }
input[type=range]:active::-webkit-slider-thumb { transform: scale(1.18); }
.presets { display: flex; flex-wrap: wrap; gap: 4px; }
.presets button { border: 1px solid var(--line); background: var(--surface-2); color: var(--text-2); font: 500 11.5px var(--font); padding: 3px 7px; border-radius: 6px; cursor: pointer; }
.presets button:hover { color: var(--text); border-color: var(--line-2); }
.presets button[aria-pressed="true"] { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
.subtle-note { font-size: 11.5px; color: var(--text-3); line-height: 1.45; }
.res-panel { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.res-panel .cell { background: var(--surface); padding: 16px 18px; }
.res-panel .k { font-size: 12px; color: var(--text-3); display: flex; gap: 6px; align-items: center; }
.res-panel .v { font: 600 24px/1.25 var(--mono); margin-top: 4px; letter-spacing: -.02em; }
.res-panel .v small { font-size: 13px; color: var(--text-3); font-weight: 500; margin-left: 3px; }
.res-panel .d { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.res-panel .cell.gov { background: linear-gradient(180deg, var(--c-geom-soft), var(--surface)); }
.gov-tag { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; padding: 1px 6px; border-radius: 5px; background: var(--c-geom); color: #04201C; }
.warns { display: grid; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line); }
.warn { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; font-size: 13.5px; }
.warn svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.warn.bad { background: var(--c-bad-soft); color: var(--c-bad); border: 1px solid color-mix(in srgb, var(--c-bad) 35%, transparent); }
.warn.warn-y { background: var(--c-warn-soft); color: var(--c-warn); border: 1px solid color-mix(in srgb, var(--c-warn) 35%, transparent); }
.warn.ok { background: var(--c-ok-soft); color: var(--c-ok); border: 1px solid color-mix(in srgb, var(--c-ok) 30%, transparent); }
.warn span { color: var(--text); } .warn span b { font-weight: 600; }
.steps { border-top: 1px solid var(--line); padding: 6px 18px 18px; }
.steps details summary { cursor: pointer; padding: 12px 0; font-weight: 600; font-size: 14px; list-style: none; display: flex; align-items: center; gap: 8px; }
.steps details summary::-webkit-details-marker { display: none; }
.steps details summary svg { width: 14px; height: 14px; transition: transform .15s; color: var(--text-3); }
.steps details[open] summary svg { transform: rotate(90deg); }
.step { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 12px; padding: 12px 0; border-top: 1px dashed var(--line); align-items: start; }
.step .sn { width: 24px; height: 24px; border-radius: 7px; background: var(--surface-3); font: 600 12px var(--mono); display: grid; place-items: center; color: var(--text-2); }
.step .sd { font-size: 13.5px; color: var(--text-2); margin-bottom: 4px; }
.step .sm { overflow-x: auto; overflow-y: hidden; padding: 2px 0; font-size: 1.02em; }
.step.gov .sn { background: var(--c-geom); color: #04201C; }

/* example / notes / quiz / related */
.ex { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 16px; }
.ex-given { position: sticky; top: calc(var(--header-h) + 16px); align-self: start; }
.ex-given dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; font-size: 13.5px; }
.ex-given dt { font-family: var(--mono); font-weight: 600; }
.ex-given dd { margin: 0; color: var(--text-2); }
.ex-steps { display: grid; gap: 10px; }
.ex-step { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 14px; padding: 16px 18px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
.ex-step .sn { width: 26px; height: 26px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font: 700 12px var(--mono); display: grid; place-items: center; }
.ex-step h4 { font-size: 14.5px; font-weight: 620; margin-bottom: 6px; }
.ex-step p { font-size: 13.5px; color: var(--text-2); margin: 0 0 6px; }
.ex-step .m { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
.ex-step.final { border-color: color-mix(in srgb, var(--c-geom) 50%, transparent); background: linear-gradient(180deg, var(--c-geom-soft), var(--surface)); }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); font-size: 13.5px; font-weight: 550; cursor: pointer; transition: all .15s; color: var(--text); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn svg { width: 15px; height: 15px; }
.notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.note { padding: 18px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); display: grid; gap: 8px; align-content: start; }
.note .nh { display: flex; align-items: center; gap: 10px; }
.note .nh .k { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; }
.note h4 { font-size: 15px; font-weight: 620; }
.note p { margin: 0; font-size: 13.5px; color: var(--text-2); }
.note .fix { font-size: 13px; color: var(--text); padding: 8px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
.note .fix b { color: var(--c-ok); }
.quiz { display: grid; gap: 14px; max-width: 820px; }
.q { padding: 20px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); }
.q .qh { display: flex; gap: 10px; align-items: baseline; margin-bottom: 14px; }
.q .qh .qn { font: 600 12px var(--mono); color: var(--accent); }
.q .qh h4 { font-size: 15.5px; font-weight: 600; line-height: 1.45; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 14px; transition: all .15s; }
.opt:hover:not([disabled]) { border-color: var(--line-2); background: var(--surface-3); }
.opt .l { font: 600 12px var(--mono); width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); flex: none; color: var(--text-2); }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--c-ok); background: var(--c-ok-soft); }
.opt.right .l { background: var(--c-ok); color: #fff; border-color: var(--c-ok); }
.opt.wrong { border-color: var(--c-bad); background: var(--c-bad-soft); }
.opt.wrong .l { background: var(--c-bad); color: #fff; border-color: var(--c-bad); }
.explain { margin-top: 12px; padding: 12px 14px; border-radius: 10px; font-size: 13.5px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line); display: none; }
.explain.show { display: block; animation: viewIn .25s var(--ease); }
.explain b { color: var(--text); }
.score { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--text-2); }
.score .bar { width: 160px; height: 6px; border-radius: 6px; background: var(--surface-3); overflow: hidden; }
.score .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--c-geom), var(--c-ok)); transition: width .4s var(--ease); }
.rel { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.rel .card { min-height: 0; padding: 16px; }
.rel .card h3 { font-size: 15px; }
.rel .card p { font-size: 13px; }

/* coming soon page */
.soon-hero { padding: 40px 0; display: grid; grid-template-columns: 1.2fr 1fr; gap: 30px; align-items: center; }
.soon-box { border: 1px dashed var(--line-2); border-radius: var(--r-xl); padding: 24px; display: grid; gap: 10px; background: var(--surface); }
.soon-box .ph { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-3), var(--surface-2), var(--surface-3)); background-size: 200% 100%; animation: shimmer 1.8s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ----------------------------- responsive ----------------------------- */
@media (max-width: 1100px) {
  .lab { grid-template-columns: 1fr; }
  .ctrl { border-left: 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
  .ctrl-top, .ctrl .full { grid-column: 1 / -1; }
  .stage { min-height: 460px; }
}
@media (max-width: 960px) {
  .topic { grid-template-columns: 1fr; gap: 0; }
  .toc { position: sticky; top: var(--header-h); z-index: 20; max-height: none; margin: 0 -24px; padding: 8px 24px; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .toc h4, .toc .toc-mini { display: none; }
  .sec { scroll-margin-top: calc(var(--header-h) + 56px); }
  .toc a { white-space: nowrap; border-left: 0; border-bottom: 2px solid transparent; border-radius: 6px; padding: 6px 10px; }
  .toc a.active { border-bottom-color: var(--accent); }
  .browse, .grid-2, .ex, .soon-hero { grid-template-columns: 1fr; }
  .grid-3 { grid-template-columns: 1fr 1fr; }
  .ex-given { position: static; }
  .hdr-nav { display: none; }
  .kbtn { min-width: 0; }
  .kbtn span.grow { display: none; }
}
@media (max-width: 680px) {
  .wrap { padding: 0 16px; }
  .hdr { padding: 0 16px; gap: 10px; }
  .brand small { display: none; }
  .ctrl { grid-template-columns: 1fr; }
  .res-panel { grid-template-columns: 1fr; }
  .grid-3 { grid-template-columns: 1fr; }
  .feq { grid-template-columns: 1fr; font-size: 1.3em; }
  .ftr { font-size: 10.5px; height: auto; min-height: var(--footer-h); padding: 4px 12px; }
  .toc { margin: 0 -16px; padding: 8px 16px; }
}

/* =========================================================================
   FULL-LIBRARY ADDITIONS: dashboard, charts, library, paragraph pages
   ========================================================================= */
.badge.rev { background: var(--c-warn-soft); color: var(--c-warn); }
.badge.mod { background: var(--accent-soft); color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 12px; margin-top: 8px; }

.stat:hover { transform: translateY(-2px); border-color: var(--line-2); }

.stat .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--c-geom), var(--accent)); width: 0; transition: width .6s var(--ease); }
.dash-2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; }
.dash-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.panel .ph { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.panel .ph h3 { margin: 0; }
.panel .ph a { font-size: 12.5px; color: var(--accent); font-weight: 550; }
.mcard { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 18px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); cursor: pointer; transition: transform .2s var(--ease), border-color .2s; overflow: hidden; min-height: 196px; }
.mcard:hover { transform: translateY(-3px); border-color: var(--line-2); }
.mcard .thumb { height: 74px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.mcard .thumb svg { width: 100%; height: 100%; }
.mcard h3 { font-size: 15.5px; font-weight: 620; }
.mcard p { font-size: 13px; color: var(--text-2); margin: 0; }
.mcard .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.mcard .done { position: absolute; top: 12px; right: 12px; }
.treemap { width: 100%; height: 380px; display: block; }
.treemap rect { stroke: var(--bg); stroke-width: 2; cursor: pointer; transition: opacity .15s; rx: 6; }
.treemap g:hover rect { opacity: .82; }
.treemap text { pointer-events: none; font-family: var(--font); }
.tm-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--text-2); margin-top: 10px; }
.tm-legend span { display: inline-flex; align-items: center; gap: 6px; }
.tm-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.hbar { display: grid; gap: 6px; }

.cta { display: flex; gap: 16px; align-items: center; padding: 18px 20px; border-radius: var(--r-lg); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); background: linear-gradient(120deg, var(--accent-soft), transparent); margin-bottom: 22px; }

.pnav { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; }

.pnav a:hover { border-color: var(--line-2); }

.graph-wrap { position: relative; height: calc(100vh - var(--header-h) - var(--footer-h) - 140px); min-height: 520px; border: 1px solid var(--line); border-radius: var(--r-xl); background: var(--canvas-bg); overflow: hidden; }
.graph-wrap > svg { width: 100%; height: 100%; display: block; cursor: grab; }

.graph-wrap .gn circle { stroke: var(--bg); stroke-width: 1.5; cursor: pointer; }

.g-tools { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 2; pointer-events: none; }

.g-info { position: absolute; right: 14px; bottom: 14px; width: 300px; z-index: 2; padding: 14px 16px; border-radius: 14px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 13px; }
.g-info b { font-family: var(--mono); }
/* generic charts */
.chart { width: 100%; display: block; overflow: visible; font-family: var(--font); }
.chart .ax { stroke: var(--line-2); }
.chart .gr { stroke: var(--line); stroke-dasharray: 2 4; }
.chart .tk { fill: var(--text-3); font-size: 13px; font-family: var(--mono); }
.chart .al { fill: var(--text-2); font-size: 14px; }
.chart .crv { fill: none; stroke-width: 2.4; }

.chart .pt:active { cursor: grabbing; }

.chart .hint { fill: var(--text-3); font-size: 11px; }
.chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; box-shadow: var(--shadow); }

.stage-svg { position: relative; min-height: 520px; background: var(--canvas-bg); display: flex; align-items: center; justify-content: center; padding: 58px 18px 18px; }
.stage-svg { align-items: flex-start; }
.stage-svg #vizHost { position: sticky; top: calc(var(--header-h) + 70px); }
.stage-svg > svg { width: 100%; height: auto; max-height: 560px; }
.sel { width: 100%; max-width: 100%; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font: 500 13px var(--font); padding: 0 8px; }
.ck { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); cursor: pointer; }

.sketches { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.sk { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px; cursor: pointer; text-align: center; font-size: 11.5px; color: var(--text-2); transition: all .15s; }
.sk:hover { border-color: var(--line-2); color: var(--text); }
.sk[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.sk svg { width: 100%; height: 64px; display: block; }
.sk b { display: block; font: 600 12px var(--mono); color: var(--text); }
.tree-q { display: grid; gap: 10px; }
.tq { padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }

.verdict { padding: 18px 20px; border-radius: 14px; border: 1px solid var(--line); display: grid; gap: 6px; }
.verdict .big { font: 700 22px var(--font); letter-spacing: -.02em; }
.matrix { width: 100%; border-collapse: separate; border-spacing: 4px; font-size: 13px; }
.matrix th { text-align: left; font-weight: 600; color: var(--text-3); font-size: 12px; padding: 4px 6px; }
.matrix td { padding: 0; }
.matrix .mc { width: 100%; height: 44px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); font: 600 15px var(--mono); cursor: pointer; color: var(--text); transition: all .12s; }
.matrix .mc:hover { border-color: var(--line-2); }
.matrix .mc[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.matrix .mc.na { opacity: .35; cursor: not-allowed; font-size: 12px; }
.matrix td.jt { font-size: 12.5px; color: var(--text-2); padding-right: 8px; }
.matrix td.jt b { font-family: var(--mono); color: var(--text); }
.hot { cursor: pointer; }
.hot circle.ring { fill: var(--accent); fill-opacity: .18; stroke: var(--accent); stroke-width: 1.5; transition: r .15s; }
.hot:hover circle.ring, .hot.on circle.ring { fill-opacity: .4; }
.hot text { font: 700 14px var(--mono); fill: var(--accent); }
.loadlist { display: grid; gap: 6px; }
.loadlist button { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 10px; align-items: start; text-align: left; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: 13px; color: var(--text-2); }
.loadlist button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.loadlist button b { font-family: var(--mono); color: var(--accent); }

/* ----------------------------- mobile nav ----------------------------- */
.mnav { display: none; position: sticky; top: var(--header-h); z-index: 45; gap: 4px; padding: 8px 16px; overflow-x: auto; scrollbar-width: none;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }

.socials { display: flex; flex-wrap: wrap; gap: 10px; }
.social { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px 0 6px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface-2); font-weight: 600; font-size: 14px; color: var(--text); transition: all .15s; }

.social.li .lg { background: #0A66C2; }
.social.em .lg { background: linear-gradient(140deg, var(--c-pressure), var(--accent)); }
.social small { display: block; font-weight: 500; font-size: 11.5px; color: var(--text-3); line-height: 1.1; }

.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.cov { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

.cov a { display: block; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); transition: border-color .15s; color: var(--text); }
.cov a:hover { border-color: var(--accent); }

@media (max-width: 960px) {

  .jstep::after { display: none; }

}
@media (max-width: 680px) {
  .hero { padding-top: 40px; }

    concept: [
      { title: 'Why shape matters', color: 'geom', icon: 'head', body: 'A sphere carries pressure purely in membrane tension, equally in every direction. That is why the hemispherical formula has <strong>2SE</strong> in the denominator, giving half the shell thickness. Flatter heads curve more sharply at the knuckle, which adds bending, so they need more metal.' },
      { title: 'The knuckle is the weak spot', color: 'stress', icon: 'bulb', body: 'In a torispherical head the crown (large radius L) and the knuckle (small radius r) meet. Pressure tries to push the knuckle into a rounder shape, so the knuckle sees high bending and compressive hoop stress. The factor <strong>M = ¼(3 + √(L/r))</strong> grows as the knuckle gets tighter.' },
      { title: 'K for ellipsoidal heads', color: 'accent', icon: 'fx', body: 'For a semi-ellipsoid with axis ratio D/2h, <strong>K = ⅙[2 + (D/2h)²]</strong>. At the standard 2:1 ratio K = 1 exactly, which is why UG-32(c) has no K. Shallower heads (D/2h = 3) need 1.83 times more thickness.' },

      lead: 'Cutting a hole in a pressurised shell removes metal that was carrying hoop stress. UG-37 asks you to <strong>put back an equal area</strong> (A = d·t<sub>r</sub>) close to the opening, within the UG-40 limits. Available area comes from excess thickness in the shell (A1) and nozzle (A2), any inward projection (A3), the welds (A4) and a reinforcing pad (A5).',

      { kind: 'Field note', color: 'warn', title: 'Groove for gasket', body: 'When the cover is grooved for a peripheral gasket (sketch k), the net thickness under the groove must still meet the formula (UG-34(d)(9)).', fix: '<b>Check:</b> design t + groove depth.' }

<script>
(function () {
  'use strict';
  var v = window.CW_V, MODULES = window.CW_MODULES;

  /* ===================================================================== UCS-66 */
  MODULES.push({
    id: 'UCS-66', slug: 'ucs-66', cat: 'materials', thumb: 'curves',
    covers: ['UCS-66', 'UG-20', 'UG-84', 'UCS-68'],
    title: 'MDMT & Impact Test Exemption',
    short: 'Do your carbon-steel parts need Charpy testing? Compare MDMT against exemption curves A–D for the governing thickness, then use the coincident-ratio reduction.',
    does: 'Interactive curves A–D with a draggable design point · ratio reduction · UG-20(f) checker',
    keywords: ['MDMT', 'minimum design metal temperature', 'impact test', 'impact testing', 'Charpy', 'exemption curve', 'curve A', 'curve B', 'curve C', 'curve D', 'governing thickness', 'coincident ratio', 'brittle fracture', 'UCS-66.1', 'UG-20(f)', 'low temperature'],
    overview: {
      lead: 'Carbon steel turns brittle when cold. UCS-66 lets you <strong>skip Charpy impact testing</strong> when the combination of <strong>MDMT</strong> and <strong>governing thickness</strong> sits on or above the exemption curve for that material (A, B, C or D). If the part is lightly stressed, Figure UCS-66.1 lets the MDMT go colder still.',
      why: 'Impact testing adds cost and schedule (test coupons, PQRs with impacts, sometimes normalised plate). Getting the curve and governing thickness right decides whether a project’s carbon-steel equipment needs it, and what MDMT goes on the nameplate.'
    },
    concept: [
      { title: 'Why thickness matters', color: 'geom', icon: 'snow', body: 'Thicker sections have more constraint (triaxial stress) at a crack tip and cool more slowly in production, both of which lower toughness. So the exemption temperature <strong>rises with thickness</strong>: a thicker plate must be warmer to be exempt.' },
      { title: 'Curves A → D', color: 'corr', icon: 'curves', body: 'Curve A is the least tough (as-rolled plates). Curve D is the toughest (normalised, fine-grain steels such as SA-516 normalised). The same SA-516-70 plate is Curve B as-rolled and Curve D normalised, which is why “normalised” on the MTR matters so much.' },
      { title: 'Governing thickness t<sub>g</sub>', color: 'accent', icon: 'fx', body: 'For butt welds it is the thickest welded joint. For corner, fillet and lap welds it is the thinner of the two parts. For flat heads and tubesheets it is the larger of that or the flat thickness divided by 4 (UCS-66(a)(1)). For nonwelded flat parts it is thickness/4.' },
      { title: 'Low stress buys temperature', color: 'stress', icon: 'bulb', body: 'Brittle fracture needs stress. If the coincident ratio (t<sub>r</sub>E*/(t<sub>n</sub> − c)) is below 1, Figure UCS-66.1 reduces the required temperature: 20 °F (11 °C) for a ratio of 0.8, 40 °F (22 °C) at 0.6, and exemption down to −105 °C at 0.35 or less.' }
    ],
    vars: {}, formulas: [],
    formulaHTML: '<div class="grid-2"><div class="box"><h3>Exemption test (UCS-66(a))</h3><p>Impact testing is <b>not</b> required when the point (t<sub>g</sub>, MDMT) is <b>on or above</b> the curve for the material. Below the curve, impact testing per UG-84 is required.</p><p class="dim">Curves are tabulated in Table UCS-66 (US and SI). The chart here uses those tabular values, with linear interpolation between them.</p></div><div class="box"><h3>Reduction (UCS-66(b), Fig. UCS-66.1)</h3><p>Ratio = t<sub>r</sub>E*/(t<sub>n</sub> − c). For ratio ≥ 0.60 the reduction is linear: <b>T<sub>R</sub> = 100(1 − ratio) °F</b> (read from the figure gridlines). Below 0.60 the curve flattens to 140 °F at 0.35. For ratio ≤ 0.35, impact testing is not required down to −155 °F (−105 °C), per UCS-66(b)(3).</p><p class="dim">The 0.35–0.60 segment here is digitised from the figure, so treat it as approximate.</p></div><div class="box"><h3>Hard limits</h3><p>MDMT colder than −55 °F (−48 °C): impact testing is required unless (b)(3) or UCS-68.2 applies. Materials 2.5 mm (0.10 in.) thick and thinner are exempt but limited to −48 °C (UCS-66(d)).</p></div><div class="box"><h3>UG-20(f) blanket exemption</h3><p>No impact test for P-No. 1 Gr 1 or 2 when t ≤ 13 mm (Curve A) or ≤ 25 mm (Curves B–D), the vessel is hydrotested, design temperature is between −29 °C and 345 °C, and thermal or mechanical shock and cyclic loading do not control the design.</p></div></div>',
    lab: { kind: 'generic', viz: 'mdmt',
      options: [{ key: 'curve', where: 'stage', def: 'B', choices: [{ v: 'A', l: 'Curve A' }, { v: 'B', l: 'Curve B' }, { v: 'C', l: 'Curve C' }, { v: 'D', l: 'Curve D' }] },
                { key: 'mat', where: 'ctrl', label: 'Pick a material (sets the curve)', def: '', choices: [{ v: '', l: '— choose —' }, { v: 'A|SA-516 70 (as-rolled)…', l: 'Generic as-rolled plate not listed elsewhere → A' }, { v: 'A|SA-105 as-forged', l: 'A/SA-105 flange, as-forged → A' }, { v: 'B|SA-516 65/70 not normalised', l: 'SA-516 Gr 65/70, not normalised → B' }, { v: 'B|SA-106 pipe', l: 'Pipe, fittings and forgings not listed in C/D → B' }, { v: 'B|SA-105 normalised', l: 'SA-105 fine-grain, normalised → B' }, { v: 'C|SA-516 55/60 not normalised', l: 'SA-516 Gr 55/60, not normalised → C' }, { v: 'C|SA-387 22 N&T', l: 'SA-387 Gr 22, N&T → C' }, { v: 'D|SA-516 normalised', l: 'SA-516 (any grade), normalised or Q&T → D' }, { v: 'D|SA-537', l: 'SA-537 Cl. 1, 2, 3 → D' }, { v: 'D|SA-524', l: 'SA-524 Cl. 1/2 pipe → D' }], apply: function (val, o) { if (val) o.curve = val.split('|')[0]; } }],
      toggles: [{ key: 'pno1', label: 'P-No.1 Gr 1/2', def: true, icon: 'p' }, { key: 'hydro', label: 'Hydrotested', def: true, icon: 'drop' }],
      inputs: [
        { key: 'tg', name: 'Governing thickness tg', color: 'geom', kind: 'length', min: 6, max: 152, def: 25, step: 0.5, curve: 1.4 },
        { key: 'mdmt', name: 'Required MDMT', color: 'corr', kind: 'temp', min: -60, max: 50, def: -20, step: 1 },
        { key: 'ratio', name: 'Coincident ratio (UCS-66.1)', color: 'stress', kind: 'ratio', min: 0.3, max: 1, def: 1, step: 0.01, presets: [{ l: '1.0', v: 1 }, { l: '0.8', v: 0.8 }, { l: '0.6', v: 0.6 }, { l: '0.35', v: 0.35 }] },
        { key: 'dt', name: 'Design temperature (max)', color: 'stress', kind: 'temp', min: -30, max: 450, def: 120, step: 5 }
      ],
      compute: function (v, u, o, h, tg) {
        var r = Engine.ucs66({ curve: o.curve, tg: v.tg, mdmt: v.mdmt, ratio: v.ratio, units: u, ug20f: { pno1: tg.pno1, hydro: tg.hydro, noShock: true, noCyclic: true, dt: v.dt } });
        var T_ = u === 'SI' ? '\\,^\\circ\\text{C}' : '\\,^\\circ\\text{F}', st = [];
        st.push({ t: 'Curve ' + o.curve + ' exemption temperature at t_g = ' + h.fL(v.tg, u) + ' (Table UCS-66, interpolated).', m: 'T_{curve} = \\mathbf{' + h.fT(r.Texempt) + '}' + T_ });
        if (v.ratio < 1) st.push({ t: 'Figure UCS-66.1 reduction for ratio ' + v.ratio.toFixed(2) + '.', m: isFinite(r.TR) ? 'T_R = ' + h.fT(r.TR) + T_ + '\\;\\Rightarrow\\; T_{allow} = ' + h.fT(r.Texempt) + ' - ' + h.fT(r.TR) + ' = \\mathbf{' + h.fT(r.Tallow) + '}' + T_ : '\\text{ratio} \\le 0.35 \\Rightarrow \\text{UCS-66(b)(3)}' });
        st.push({ t: 'Compare the required MDMT with the allowable temperature.', gov: true, m: '\\text{MDMT} = ' + h.fT(v.mdmt) + (r.exempt ? '\\;\\ge\\;' : '\\;<\\;') + h.fT(r.Tallow) + T_ + (r.exempt ? '\\;\\Rightarrow\\;\\text{no impact test}' + h.CHK : '\\;\\Rightarrow\\;\\text{impact test}' + h.BAD) });
        var f = r.ug20f;
        st.push({ t: 'UG-20(f) blanket exemption check.', m: '\\text{P-No.1: }' + (f.pno ? '✓' : '✗') + ',\\; t \\le ' + h.fN(f.tlim, u) + ': ' + (f.thick ? '✓' : '✗') + ',\\; T\\text{-range: }' + (f.temp ? '✓' : '✗') + ',\\; \\text{hydro: }' + (f.hydro ? '✓' : '✗') + '\\;\\Rightarrow\\; ' + (f.all ? '\\text{exempt}' : '\\text{not applicable}') });
        return { res: r, steps: st, warnings: r.warnings.concat(f.all ? [{ level: 'ok', ref: 'UG-20(f)', msg: 'Also exempt under UG-20(f), provided shock and cyclic loading do not control the design.' }] : []),
          cells: [{ k: 'Verdict', v: r.exempt ? 'Exempt' : 'Impact test', u: '', d: 'Curve ' + o.curve + ', tg ' + h.fL(v.tg, u) + ' ' + (u === 'SI' ? 'mm' : 'in'), gov: true, cls: r.exempt ? 'c-geom' : 'c-bad' },
                  { k: 'Curve temperature', v: h.fT(r.Texempt), u: u === 'SI' ? '°C' : '°F', d: 'Table UCS-66' },
                  { k: 'With ratio reduction', v: isFinite(r.TR) ? h.fT(r.Tallow) : '≤ −105', u: u === 'SI' ? '°C' : '°F', d: 'Fig. UCS-66.1, ratio ' + v.ratio.toFixed(2) }],
          viz: { r: r, tg: v.tg, mdmt: v.mdmt, curve: o.curve, units: u } };
      } },
    example: {
      title: 'MDMT for the separator shell',
      intro: 'The 20 mm SA-516-70 shell (17 mm corroded), as-rolled (not normalised), so Curve B. The site requires an MDMT of −20 °C.',
      given: [['Material', 'SA-516 Gr 70, not normalised → Curve B'], ['tg', '20 mm (butt welds in the 20 mm shell)'], ['MDMT required', '−20 °C'], ['Ratio', 'tr·E*/(tn − c) = 15.53×0.85/(20 − 3)… see below']],
      steps: function (h) { var T = Engine.ucs66Exempt('B', 20, 'SI'), ratio = 15.53 * 1 / (20 - 3), TR = Engine.ucs661(ratio) * 5 / 9, TD = Engine.ucs66Exempt('D', 20, 'SI');
        return [{ t: 'Curve B at 20 mm (interpolating Table UCS-66 between 19.1 and 20.6 mm).', m: 'T_B = \\mathbf{' + T.toFixed(1) + '}\\,^\\circ\\text{C} > -20\\,^\\circ\\text{C}\\;\\Rightarrow\\;\\text{not exempt by the curve alone}' },
                { t: 'Coincident ratio (E* = E = 1 used here for illustration: tr from the shell with E*).', m: '\\text{ratio} = \\dfrac{t_r E^*}{t_n - c} \\approx \\dfrac{15.53}{17} = ' + ratio.toFixed(3) },
                { t: 'Reduction from Figure UCS-66.1 (linear region).', m: 'T_R = 100(1 - ' + ratio.toFixed(3) + ') = ' + (100 * (1 - ratio)).toFixed(1) + '\\,^\\circ\\text{F} = ' + TR.toFixed(1) + '\\,^\\circ\\text{C}' },
                { t: 'Reduced exemption temperature.', m: T.toFixed(1) + ' - ' + TR.toFixed(1) + ' = \\mathbf{' + (T - TR).toFixed(1) + '}\\,^\\circ\\text{C}' + (T - TR <= -20 ? '\\le -20\\;\\checkmark' : '> -20\\;\\times') },
                { t: 'Alternative: order normalised plate (Curve D).', m: 'T_D(20\\,\\text{mm}) = \\mathbf{' + TD.toFixed(1) + '}\\,^\\circ\\text{C} \\le -20\\;\\checkmark' }]; },
      result: function () { var T = Engine.ucs66Exempt('B', 20, 'SI'), ratio = 15.53 / 17, TR = Engine.ucs661(ratio) * 5 / 9;
        return 'As-rolled plate on Curve B is exempt only down to about <b>' + (T - TR).toFixed(0) + ' °C</b> even with the ratio credit' + (T - TR <= -20 ? ', which is enough.' : ', which is <b>not enough</b> for −20 °C.') + ' The simplest fix is to <b>specify SA-516-70N (normalised, Curve D)</b>, exempt to about ' + Engine.ucs66Exempt('D', 20, 'SI').toFixed(0) + ' °C with no impact testing. That is why most EPC specifications call for "N" plate.'; }
    },
    notes: [
      { kind: 'Mistake', color: 'bad', title: 'Wrong curve for SA-516', body: 'SA-516 is Curve B as-rolled and Curve D only when <strong>normalised</strong> (or Q&T). If the MTR doesn’t say normalised, it is Curve B.', fix: '<b>Spec:</b> “SA-516-70N” and verify the heat-treatment line on the MTR.' },
      { kind: 'Mistake', color: 'bad', title: 'Governing thickness of a nozzle joint', body: 'For a nozzle-to-shell corner weld, tg is the <strong>thinner</strong> of the parts joined, not the shell thickness. Each component and weld is checked, and the warmest MDMT governs (UCS-66(a)(1)(-a)(-4)).', fix: '<b>Use:</b> Figure UCS-66.3 sketches.' },
      { kind: 'Field note', color: 'warn', title: 'Bolting is different', body: 'Bolts and nuts have their own exemption temperatures in the Figure UCS-66 notes, and Figure UCS-66.1 may not be used for bolting.', fix: '<b>Check:</b> SA-193 B7 exemption to −48 °C; SA-320 L7 for colder service.' },
      { kind: 'Field note', color: 'warn', title: 'Stamped MDMT', body: 'The nameplate MDMT corresponds to a coincident pressure equal to MAWP (UG-20(b)). A colder MDMT at reduced pressure can also be marked.', fix: '<b>Tip:</b> UCS-A-3 covers operating colder than the stamped MDMT.' }
    ],
    quiz: [
      { q: 'As thickness increases, what happens to the exemption temperature on a given curve?', opts: ['It gets colder', 'It gets warmer', 'Unchanged', 'Only on Curve A'], a: 1, why: 'Thicker sections are less tough, so they must be warmer to be exempt. The curves rise to the right.' },
      { q: 'Which curve applies to SA-516 Gr 70 supplied normalised?', opts: ['A', 'B', 'C', 'D'], a: 3, why: 'Figure UCS-66 Note 4: SA-516 if normalised or quenched and tempered is Curve D.' },
      { q: 'The coincident ratio is 0.8. What reduction does Figure UCS-66.1 allow?', opts: ['8 °F', '20 °F (11 °C)', '40 °F', '80 °F'], a: 1, why: 'In the linear region the reduction is 100(1 − 0.8) = 20 °F, about 11 °C.' }
    ],
    related: ['UCS-56', 'UG-99', 'UG-27', 'UW-12']
  });

  /* ===================================================================== Pressure ladder (UG-98/99/100/153/155) */
  MODULES.push({
    id: 'UG-99', slug: 'ug-99', cat: 'testing', thumb: 'ladder',
    covers: ['UG-99', 'UG-100', 'UG-98', 'UG-21', 'UG-153', 'UG-155', 'UG-150', 'UG-151', 'UG-152', 'UG-154'],
    title: 'Pressure Ladder: Design, MAWP, Test & Relief',
    short: 'One picture of every pressure on a vessel: operating, design, MAWP, hydro and pneumatic test, relief set points and allowed accumulation.',
    does: 'Interactive pressure ladder · hydro and pneumatic calculator · relief settings',
    keywords: ['hydrotest', 'hydrostatic test', 'pneumatic test', 'test pressure', '1.3 MAWP', '1.1 MAWP', 'LSR', 'lowest stress ratio', 'MAWP', 'design pressure', 'relief valve', 'set pressure', 'accumulation', 'overpressure', 'fire case', '10%', '16%', '21%', 'PSV'],
    overview: {
      lead: 'Engineers juggle several pressures that are easy to confuse. <strong>Operating</strong> ≤ <strong>design</strong> (UG-21) ≤ <strong>MAWP</strong> (UG-98, set by the weakest corroded part). The <strong>hydrotest</strong> is 1.3 × MAWP × LSR (UG-99) and the <strong>pneumatic test</strong> 1.1 × MAWP × LSR (UG-100). Relief devices are <strong>set</strong> at or below MAWP (UG-155) and may let pressure <strong>accumulate</strong> 10%, 16% or 21% above it (UG-153).',
      why: 'This ladder appears on every data sheet, PSV sizing and hydrotest procedure. Margins between operating pressure and set pressure decide whether relief valves simmer in service. Static head decides whether the bottom of a tall column is overstressed during a field hydro.'
    },
    concept: [
      { title: 'MAWP vs design pressure', color: 'pressure', icon: 'ladder', body: 'Design pressure is what you <em>ask</em> the vessel to handle. MAWP is what it can <em>actually</em> handle at the top, in the corroded condition, at coincident temperature, limited by the weakest part. Because plate is rounded up, MAWP is usually above design pressure.' },
      { title: 'LSR scales the test', color: 'stress', icon: 'fx', body: 'The test runs cold, where allowable stress S is higher than at design temperature. The lowest stress ratio S<sub>test</sub>/S<sub>design</sub> across pressure-boundary materials (bolting excluded) raises the test pressure so the test is as severe as hot service.' },
      { title: 'Static head', color: 'geom', icon: 'drop', body: 'Test pressure is required at every point in the vessel, and the gauge reading is adjusted for elevation. A 30 m column tested horizontally differs from one tested vertically by about 0.3 MPa of water head at the bottom.' },
      { title: 'Relief: set vs accumulation', color: 'corr', icon: 'bulb', body: '<strong>Set</strong> is where the valve starts to open: ≤ MAWP for a single device, up to 105% for extra devices, 110% for fire-only devices. <strong>Accumulation</strong> is the peak pressure allowed while relieving: 110% (or +20 kPa), 116% (multiple), 121% (fire).' }
    ],
    vars: {}, formulas: [],
    formulaHTML: '<div class="grid-3"><div class="box"><h3>Hydrostatic (UG-99(b))</h3><p class="mono" style="font-size:16px">P<sub>T</sub> ≥ 1.3 × MAWP × LSR</p><p>At every point; gauge adjusted for static head. Inspect at MAWP after the test (UG-99(h)). Metal temperature ≥ MDMT + 17 °C (30 °F), and inspection temperature normally ≤ 48 °C (120 °F).</p></div><div class="box"><h3>Pneumatic (UG-100(b))</h3><p class="mono" style="font-size:16px">P<sub>T</sub> ≥ 1.1 × MAWP × LSR</p><p>Only when a hydro is impractical. Coldest metal temperature ≥ MDMT + 17 °C. Extra NDE first (UW-50). Pressure raised in steps.</p></div><div class="box"><h3>Overpressure (UG-153, UG-155)</h3><p>Accumulation: <b>max(10%, 20 kPa)</b> single device · <b>max(16%, 30 kPa)</b> multiple · <b>21%</b> fire.<br>Set: ≤ MAWP (one device) · ≤ 105% (additional) · ≤ 110% (fire supplemental).</p></div></div>',
    lab: { kind: 'generic', viz: 'ladder',
      options: [{ key: 'relief', where: 'stage', def: 'single', choices: [{ v: 'single', l: 'Single PSV' }, { v: 'multi', l: 'Multiple PSVs' }, { v: 'fire', l: 'Fire case' }] }],
      toggles: [{ key: 'showP', label: 'Pneumatic', def: false, icon: 'p' }],
      inputs: [
        { key: 'op', name: 'Operating pressure', color: 'pressure', kind: 'pressure', min: 0.05, max: 15, def: 1.5, curve: 1.6 },
        { key: 'design', name: 'Design pressure', color: 'pressure', kind: 'pressure', min: 0.05, max: 15, def: 1.8, curve: 1.6 },
        { key: 'mawp', name: 'MAWP (from calculations)', color: 'pressure', kind: 'pressure', min: 0.05, max: 18, def: 1.968, curve: 1.6, note: 'Use the lowest MAWP from all parts, for example UG-27 shell, UG-32 heads and flange ratings.' },
        { key: 'lsr', name: 'Lowest stress ratio LSR', color: 'stress', kind: 'ratio', min: 1, max: 1.6, def: 1, step: 0.01, note: 'S at test temperature ÷ S at design temperature, lowest across pressure-boundary materials (excluding bolting).' },
        { key: 'height', name: 'Height of liquid above lowest point', color: 'geom', kind: 'height', min: 0, max: 80, def: 2.1, step: 0.1 },
        { key: 'mdmt', name: 'MDMT', color: 'corr', kind: 'temp', min: -60, max: 40, def: -20, step: 1 }
      ],
      compute: function (v, u, o, h, tg) {
        var r = Engine.ladder({ mawp: v.mawp, lsr: v.lsr, op: v.op, design: v.design, height: v.height, units: u });
        var P_ = h.uP(u), st = [];
        st.push({ t: 'Hydrostatic test pressure at the top (UG-99(b)).', gov: true, m: 'P_T = 1.3\\times' + h.fP(v.mawp, u) + '\\times' + v.lsr.toFixed(2) + ' = \\mathbf{' + h.fP(r.hydro, u) + '}' + P_ });
        st.push({ t: 'Static head of water at the lowest point (ρg·h).', m: '\\Delta P = ' + h.fP(r.head, u) + P_ + '\\;\\Rightarrow\\; P_{bottom} = ' + h.fP(r.hydroBottom, u) + P_ });
        st.push({ t: 'Pneumatic alternative (UG-100(b)).', m: 'P_T = 1.1\\times' + h.fP(v.mawp, u) + '\\times' + v.lsr.toFixed(2) + ' = ' + h.fP(r.pneu, u) + P_ });

  EXTRAS.thinThick = function (el, m, h) {
    el.innerHTML = '<div class="chart-card"><h4>Thin-wall vs thick-wall: where UG-27 stops working</h4><p class="sub">Required t/R against P/SE for a cylinder (hoop stress). Hover to read values. The dot is your lab input.</p><svg class="chart" id="ttc" viewBox="0 0 760 340"></svg></div>';

      s += '<path class="crv" d="' + c.path(pts(function (x) { return Math.min(1.8, x / Math.max(1e-6, 1 - 0.6 * x)); })) + '" stroke="var(--c-geom)"/>';
      s += '<path class="crv" d="' + c.path(pts(function (x) { return Math.exp(x) - 1; })) + '" stroke="var(--c-stress)"/>';
