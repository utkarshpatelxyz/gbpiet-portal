  <!-- ═══════════════════════════════════════════════════════════════
       HELP — on every screen, above every app.
  ═══════════════════════════════════════════════════════════════════ -->
  <div class="mhb" id="mhb">
    <button type="button" class="mhb-fab" id="mhbFab" aria-label="Help" aria-expanded="false" aria-controls="mhbPanel">
      <svg class="i-q" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.6a8.4 8.4 0 0 1-12.2 7.5L3.5 20.5l1.4-4.6A8.4 8.4 0 1 1 21 11.6z"/><path d="M9.9 9.3a2.3 2.3 0 0 1 4.4.9c0 1.5-2.2 2-2.2 3.3"/><path d="M12.1 16.2h.01" stroke-width="2.4"/></svg>
      <svg class="i-x" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <span class="mhb-tipl" aria-hidden="true">Need help?</span>
    <section class="mhb-panel" id="mhbPanel" role="dialog" aria-label="MERIDIAM Help" hidden>
      <header class="mhb-head">
        <span class="mhb-av" aria-hidden="true"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.6a8.4 8.4 0 0 1-12.2 7.5L3.5 20.5l1.4-4.6A8.4 8.4 0 1 1 21 11.6z"/><path d="M9.9 9.3a2.3 2.3 0 0 1 4.4.9c0 1.5-2.2 2-2.2 3.3"/><path d="M12.1 16.2h.01" stroke-width="2.4"/></svg></span>
        <div class="mhb-ht"><b>MERIDIAM Help</b><small id="mhbCtx"></small></div>
        <button type="button" class="mhb-x" id="mhbClose" aria-label="Close help"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <div class="mhb-thread" id="mhbThread" aria-live="polite"></div>
      <div class="mhb-dock" id="mhbDock">
        <div class="mhb-dl">Common questions</div>
        <div class="mhb-qs" id="mhbQs"></div>
        <button type="button" class="mhb-miss" id="mhbMiss">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>
          Your issue is not listed
        </button>
      </div>
      <div class="mhb-compose" id="mhbCompose" hidden>
        <label for="mhbText">Describe your issue</label>
        <textarea id="mhbText" maxlength="1500" placeholder="What were you doing, what did you expect, and what happened instead?"></textarea>
        <div class="mhb-crow">
          <button type="button" class="mhb-back" id="mhbBack">← Back to questions</button>
          <span class="mhb-count" id="mhbCount">0 / 1500</span>
          <button type="button" class="mhb-send" id="mhbSend" hidden>Send
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
          </button>
        </div>
        <div class="mhb-to">Opens your email app (Outlook), addressed to <b>upatel@tecnicasreunidas.es</b></div>
      </div>
    </section>
    <iframe class="mhb-mailframe" id="mhbMailFrame" title="mail" aria-hidden="true" tabindex="-1"></iframe>
  </div>
