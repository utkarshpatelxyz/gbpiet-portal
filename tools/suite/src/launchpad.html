  <div data-view="main" class="mlp" style="display:block;">
    <header class="mlp-shell">
      <button type="button" class="mlp-brand" onclick="mlpGoTab('all')" title="MERIDIAM — all apps" aria-label="MERIDIAM — all apps">
        <span class="mrd-brand-logo" role="img" aria-label="MERIDIAM"></span>
      </button>
      <span class="mlp-sep"></span>
      <span class="mlp-product">Static Equipment Intelligence</span>

        <input id="mlpQ" type="search" placeholder="Search apps" autocomplete="off" spellcheck="false" aria-label="Search apps">

    <main class="mlp-page">

          <button type="button" data-g="eng">Engineering &amp; Codes</button>

      <div class="mlp-scope" id="mlpScope"></div>

      <section class="mlp-grp" data-g="ctl">
        <h2>Document &amp; Schedule Control</h2>
        <div class="mlp-tiles">
          <button type="button" class="mlp-tile" data-app="drm" data-k="vendor documents review crs po purchase order transmittal engineer consolidated status"
                  data-tip="Load the Consolidated Status workbook, pick your department, discipline and purchase order, then work the lists — your review actions, what is waiting on others, the client CRS, engineers and reports.">
            <span class="t">Document Review Management</span>
            <span class="d">Vendor documents &amp; CRS</span>
            <span class="mid"></span>
            <span class="ft">
              <span class="ic"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m8.6 14.4 2.3 2.3 4.4-4.7"/></svg></span>

            <span class="d">Milestones &amp; progress</span>
            <span class="mid"></span>
            <span class="ft">
              <span class="ic"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="9" height="3.2" rx="1"/><rect x="7" y="10.4" width="9" height="3.2" rx="1"/><rect x="4.5" y="16.3" width="6.5" height="3.2" rx="1"/><path d="m19.2 15.2 2.3 2.7-2.3 2.7-2.3-2.7z"/></svg></span>
              <span class="inf">P6-PLAN4E export</span>
            </span>
          </button>
        </div>
      </section>

      <section class="mlp-grp" data-g="eng">
        <h2>Engineering &amp; Codes</h2>
        <div class="mlp-tiles">

            <span class="ft">

            </span>

      <div class="mlp-empty" id="mlpEmpty" hidden>No app matches “<b></b>”.</div>
