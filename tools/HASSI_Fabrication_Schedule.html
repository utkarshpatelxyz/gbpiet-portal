<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HASSI MESSAOUD — Fabrication Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   HASSI MESSAOUD REFINERY — FABRICATION SCHEDULE EXPLORER
   Same visual language as the CEYHAN Project-Details explorer (navy / blue /
   gold, flowing animated connectors, reveal-on-scroll, spring transitions).
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --navy:#0B2545; --navy2:#12395C; --blue:#2563EB; --cyan:#06B6D4;
  --ink:#1A2432; --muted:#5C6B7A; --line:#E4E9F0; --line2:#D3DBE6;
  --bg:#EEF2F8; --sf:#FFFFFF; --sf2:#F6F9FC;
  --gold:#C8A227; --gold-d:#B8860B; --gold-bg:#FBF4DC;
  --grey-fill:#EDF0F4; --grey-border:#9AA3AE;
  --done:#B8860B; --pending:#9AA3AE;
  --ok:#2E9E6B;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.4,0,.2,1);
  --font:'Montserrat','Inter','Segoe UI',Arial,sans-serif;
  --sh1:0 1px 3px rgba(11,37,69,.07); --sh2:0 6px 24px rgba(11,37,69,.10);
  --sh3:0 16px 50px rgba(11,37,69,.18);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font); color:var(--ink); background:var(--bg);
  line-height:1.5; overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:-20% -10% -10% -10%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(42rem 42rem at 12% 8%, rgba(37,99,235,.14), transparent 60%),
    radial-gradient(38rem 38rem at 92% 4%, rgba(6,182,212,.12), transparent 60%),
    radial-gradient(46rem 46rem at 78% 96%, rgba(200,162,39,.12), transparent 62%);
}
::-webkit-scrollbar{width:11px;height:11px;}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:20px;border:3px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--grey-border);}

/* ── Top bar ────────────────────────────────────────────────────────────── */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid var(--line);}
.nav-in{max-width:1280px;margin:0 auto;padding:11px 26px;display:flex;align-items:center;gap:14px;}
.brand{font-size:15px;font-weight:800;color:var(--navy);letter-spacing:.2px;white-space:nowrap;}
.brand b{color:var(--cyan);}
.brand small{display:block;font-size:9.5px;font-weight:600;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:1px;}
.nav-sep{width:1px;height:26px;background:var(--line);}
.nav-crumbs{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted);flex-wrap:wrap;}
.nav-crumbs .c{cursor:pointer;transition:color .15s;}
.nav-crumbs .c:hover{color:var(--blue);}
.nav-crumbs .c.on{color:var(--navy);cursor:default;}
.nav-crumbs .sep{color:var(--line2);}
.nav-spacer{flex:1;}
.nav-po{font-size:11px;font-weight:700;color:var(--navy);background:var(--sf2);border:1px solid var(--line);
  padding:5px 11px;border-radius:20px;white-space:nowrap;}
.nav-po b{color:var(--gold-d);}

.wrap{max-width:1280px;margin:0 auto;padding:0 26px;}

/* ── Reveal ─────────────────────────────────────────────────────────────── */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease);}
.reveal.in{opacity:1;transform:none;}

/* ── Hero ───────────────────────────────────────────────────────────────── */
.hero{padding:46px 0 26px;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--blue);margin-bottom:14px;}
.eyebrow .pulse{width:8px;height:8px;border-radius:50%;background:var(--cyan);position:relative;}
.eyebrow .pulse::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--cyan);
  animation:ping 1.9s var(--ease) infinite;}
@keyframes ping{0%{transform:scale(.6);opacity:.9;}100%{transform:scale(1.9);opacity:0;}}
.hero h1{font-size:clamp(26px,4.4vw,44px);font-weight:800;color:var(--navy);letter-spacing:-.6px;line-height:1.08;}
.hero h1 .no{color:var(--gold-d);}
.hero-sub{font-size:15px;color:var(--muted);font-weight:500;margin-top:12px;max-width:680px;}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;}
.chip{display:flex;flex-direction:column;gap:2px;background:var(--sf);border:1px solid var(--line);border-radius:12px;
  padding:12px 16px;box-shadow:var(--sh1);min-width:130px;}
.chip .k{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.chip .v{font-size:16px;font-weight:800;color:var(--navy);letter-spacing:-.2px;}
.chip .v b{color:var(--gold-d);}

/* ── PO summary band ────────────────────────────────────────────────────── */
.po-band{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);border-radius:20px;
  padding:26px 28px;margin:14px 0 32px;color:#fff;box-shadow:var(--sh2);position:relative;overflow:hidden;}
.po-band::after{content:'';position:absolute;right:-40px;top:-60px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(6,182,212,.28),transparent 68%);}
.po-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative;z-index:1;}
.po-head .pk{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6);}
.po-head .pno{font-size:22px;font-weight:800;letter-spacing:-.3px;}
.po-head .pno b{color:#F2CE52;}
.po-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px;position:relative;z-index:1;}
.po-stat .n{font-size:26px;font-weight:800;letter-spacing:-.5px;}
.po-stat .n b{color:#F2CE52;}
.po-stat .l{font-size:11px;font-weight:600;color:rgba(255,255,255,.66);margin-top:2px;}
@media(max-width:640px){.po-stats{grid-template-columns:repeat(2,1fr);}}

/* ── Category + equipment grid ──────────────────────────────────────────── */
.section-h{display:flex;align-items:baseline;gap:12px;margin:30px 0 14px;}
.section-h h2{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:-.3px;}
.section-h .cnt{font-size:12px;font-weight:700;color:var(--muted);background:var(--sf);border:1px solid var(--line);
  padding:3px 10px;border-radius:20px;}
.section-h .rule{flex:1;height:1px;background:var(--line);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.eq-card{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;
  box-shadow:var(--sh1);transition:transform .22s var(--spring),box-shadow .24s var(--ease),border-color .18s;position:relative;overflow:hidden;}
.eq-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue);transform:scaleY(0);
  transform-origin:top;transition:transform .3s var(--ease);}
.eq-card:hover{transform:translateY(-4px);box-shadow:var(--sh2);border-color:rgba(37,99,235,.4);}
.eq-card:hover::before{transform:scaleY(1);}
.eq-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.eq-tag{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.2px;}
.eq-type{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);
  background:rgba(37,99,235,.09);padding:3px 8px;border-radius:6px;margin-top:4px;display:inline-block;}
.eq-ico{width:42px;height:42px;flex:0 0 auto;opacity:.9;}
.eq-meta{display:flex;gap:16px;margin-top:14px;}
.eq-meta div{font-size:11px;}
.eq-meta .k{font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:9px;}
.eq-meta .v{font-weight:700;color:var(--navy);font-size:13px;margin-top:1px;}
.eq-prog{margin-top:15px;}
.eq-prog-t{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;margin-bottom:5px;}
.eq-prog-t .p{color:var(--gold-d);}
.eq-prog-t .s{color:var(--muted);}
.bar{height:7px;border-radius:20px;background:var(--grey-fill);overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--gold),var(--gold-d));
  width:0;transition:width 1s var(--ease);}
.eq-go{margin-top:13px;font-size:11.5px;font-weight:700;color:var(--blue);display:flex;align-items:center;gap:5px;}
.eq-go .ar{transition:transform .2s var(--ease);}
.eq-card:hover .eq-go .ar{transform:translateX(4px);}

/* ── Detail view ────────────────────────────────────────────────────────── */
#detail{display:none;}
#detail.on{display:block;}
.back{display:inline-flex;align-items:center;gap:7px;background:var(--sf);border:1px solid var(--line);
  color:var(--navy);border-radius:22px;padding:8px 16px;font-size:12.5px;font-weight:700;cursor:pointer;
  font-family:inherit;margin:22px 0 6px;box-shadow:var(--sh1);transition:all .18s;}
.back:hover{background:var(--navy);color:#fff;border-color:transparent;transform:translateX(-3px);}

.d-head{display:flex;flex-wrap:wrap;align-items:center;gap:20px;margin:14px 0 8px;}
.d-title{flex:1 1 auto;min-width:260px;}
.d-title .t{font-size:clamp(24px,3.6vw,38px);font-weight:800;color:var(--navy);letter-spacing:-.5px;}
.d-title .sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px;}
.ring{width:96px;height:96px;flex:0 0 auto;position:relative;}
.ring svg{transform:rotate(-90deg);}
.ring .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring .rt b{font-size:22px;font-weight:800;color:var(--gold-d);line-height:1;}
.ring .rt span{font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px;}

.d-meta{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 8px;}
.d-meta .m{background:var(--sf);border:1px solid var(--line);border-radius:11px;padding:9px 14px;box-shadow:var(--sh1);}
.d-meta .m .k{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
.d-meta .m .v{font-size:14px;font-weight:800;color:var(--navy);margin-top:2px;}
.d-meta .m.hl .v{color:var(--gold-d);}

/* ── Gantt ──────────────────────────────────────────────────────────────── */
.gantt-card{background:var(--sf);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh2);
  margin:20px 0;overflow:hidden;}
.gantt-hd{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.gantt-hd h3{font-size:15px;font-weight:800;color:var(--navy);}
.gantt-hd .leg{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap;}
.gantt-hd .leg span{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);}
.gantt-hd .leg i{width:14px;height:6px;border-radius:3px;display:block;}
.gantt-hd .leg i.done{background:linear-gradient(90deg,var(--gold),var(--gold-d));}
.gantt-hd .leg i.pend{background:var(--pending);}
.gantt-hd .leg i.today{width:3px;height:14px;background:#E0483B;border-radius:1px;}
.gantt-scroll{overflow-x:auto;overflow-y:hidden;padding:0 0 6px;}
.gantt{position:relative;min-width:900px;}
.g-months{display:flex;position:sticky;top:0;background:var(--sf2);border-bottom:1px solid var(--line);z-index:3;}
.g-side{flex:0 0 var(--sidew);}
.g-month{flex:1 1 0;border-left:1px solid var(--line);padding:7px 0 5px;text-align:center;}
.g-month .mm{font-size:11px;font-weight:800;color:var(--navy);letter-spacing:.04em;}
.g-month .yy{font-size:8.5px;font-weight:700;color:var(--muted);}
.g-days{display:flex;font-size:0;}
.g-day{flex:1;border-left:1px dotted var(--line);height:6px;}
.g-grouprow{display:flex;align-items:center;background:linear-gradient(90deg,rgba(11,37,69,.05),transparent);
  border-top:1px solid var(--line);}
.g-grouprow .lbl{flex:0 0 var(--sidew);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--navy);padding:7px 14px;}
.g-row{display:flex;align-items:stretch;border-top:1px solid var(--line);min-height:46px;position:relative;}
.g-row:hover{background:var(--sf2);}
.g-row .r-side{flex:0 0 var(--sidew);padding:8px 14px;display:flex;flex-direction:column;justify-content:center;
  border-right:1px solid var(--line);position:sticky;left:0;background:inherit;z-index:2;}
.g-row:hover .r-side{background:var(--sf2);}
.g-row .r-side .rn{font-size:12.5px;font-weight:700;color:var(--ink);}
.g-row .r-side .rc{font-size:9.5px;font-weight:600;color:var(--muted);margin-top:1px;}
.g-track{flex:1 1 0;position:relative;}
.g-cellgrid{position:absolute;inset:0;display:flex;pointer-events:none;}
.g-cellgrid .gm{flex:1;border-left:1px solid var(--line);}
.g-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.flow{fill:none;stroke-width:3;stroke-linecap:round;}
.flow.done{stroke:var(--done);}
.flow.pend{stroke:var(--pending);stroke-dasharray:2 6;}
.flow-pulse{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:.16 .84;stroke-dashoffset:1;
  animation:flow 2.4s linear infinite;}
@keyframes flow{to{stroke-dashoffset:-1;}}
.node{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:2;}
.node .dot{width:15px;height:15px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(11,37,69,.3);
  transition:transform .16s var(--spring);}
.node .dot.done{background:var(--done);}
.node .dot.pend{background:var(--pending);}
.node:hover .dot{transform:scale(1.42);}
.node .nlab{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:800;
  color:var(--navy);white-space:nowrap;background:rgba(255,255,255,.86);padding:0 3px;border-radius:3px;}
.node.pk .dot{width:0;height:0;border:none;background:none;}
.node.pk::after{content:'▶';color:#E0483B;font-size:13px;position:absolute;transform:translate(-50%,-50%);}
.today-line{position:absolute;top:0;bottom:0;width:2px;background:#E0483B;z-index:4;}
.today-line::before{content:'DATA DATE';position:absolute;top:-16px;left:4px;font-size:8px;font-weight:800;
  color:#E0483B;white-space:nowrap;letter-spacing:.06em;background:rgba(255,255,255,.9);padding:0 2px;border-radius:2px;}
.today-line.no-label::before{display:none;}
.today-band{position:absolute;top:0;bottom:0;left:0;background:rgba(200,162,39,.10);z-index:0;border-right:1px dashed rgba(200,162,39,.5);}

/* tooltip */
#tip{position:fixed;z-index:200;background:var(--navy);color:#fff;padding:9px 12px;border-radius:9px;
  font-size:11.5px;font-weight:600;box-shadow:var(--sh3);pointer-events:none;opacity:0;transform:translateY(6px);
  transition:opacity .14s,transform .14s;max-width:240px;}
#tip.show{opacity:1;transform:none;}
#tip .tt{font-weight:800;font-size:12.5px;margin-bottom:2px;}
#tip .td{color:#B9D0E8;font-size:10.5px;}
#tip .ts{margin-top:4px;font-size:10px;font-weight:700;}
#tip .ts.done{color:#F2CE52;}
#tip .ts.pend{color:#9DB4CB;}

/* ── Process flow (stage summary) ───────────────────────────────────────── */
.stages{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 4px;}
.stage{flex:1 1 120px;background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--sh1);
  position:relative;overflow:hidden;}
.stage .si{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.stage .sv{font-size:13px;font-weight:700;color:var(--navy);margin-top:3px;}
.stage.done{border-color:rgba(184,134,11,.4);background:linear-gradient(180deg,var(--gold-bg),var(--sf));}
.stage.done .si{color:var(--gold-d);}

/* ── Legend card ────────────────────────────────────────────────────────── */
.legend-card{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--sh1);margin:20px 0 40px;}
.legend-card h3{font-size:13px;font-weight:800;color:var(--navy);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;}
.legend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 22px;}
.legend-grid .li{display:flex;gap:8px;font-size:11.5px;}
.legend-grid .li b{color:var(--gold-d);font-weight:800;min-width:44px;}
.legend-grid .li span{color:var(--muted);font-weight:600;}

.footer{padding:26px 0 40px;text-align:center;font-size:11px;color:var(--muted);font-weight:600;border-top:1px solid var(--line);margin-top:20px;}
@media(max-width:720px){ :root{--sidew:130px;} .gantt-hd .leg{width:100%;margin-left:0;} }
</style>
</head>

<script>
(function(){
'use strict';
const DATA = JSON.parse(document.getElementById('fab-data').textContent);
const MONTHS=['','JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* Timeline window: Jul 2026 → Mar 2027 (matches the schedule sheet) */
const WIN=[{m:7,y:2026},{m:8,y:2026},{m:9,y:2026},{m:10,y:2026},{m:11,y:2026},{m:12,y:2026},
           {m:1,y:2027},{m:2,y:2027},{m:3,y:2027}];
function keyFrac(k){ // k = yyyymmdd  → fractional month index in WIN [0..WIN.length]
  const y=Math.floor(k/10000), m=Math.floor(k/100)%100, d=k%100;
  let idx=WIN.findIndex(w=>w.m===m&&w.y===y);
  if(idx<0){ // clamp
    const kk=y*100+m;
    if(kk < WIN[0].y*100+WIN[0].m) return 0;
    return WIN.length;
  }
  return idx + Math.min(1,(d-1)/30.4);
}

/* ── Overview ──────────────────────────────────────────────────────────── */
function typeOf(tag){ return tag.includes('-R-')?'Reactor / Vessel':(tag.includes('-D-')?'Drum':'Equipment'); }
function iconFor(tag){
  const r=tag.includes('-R-');
  // simple vessel svg (vertical for R, horizontal drum for D)
  if(r) return '<svg class="eq-ico" viewBox="0 0 48 48" fill="none"><rect x="17" y="8" width="14" height="30" rx="7" stroke="#2563EB" stroke-width="2"/><path d="M17 15h14M17 31h14" stroke="#06B6D4" stroke-width="1.6"/><path d="M24 38v5M20 43h8" stroke="#B8860B" stroke-width="2" stroke-linecap="round"/></svg>';
  return '<svg class="eq-ico" viewBox="0 0 48 48" fill="none"><rect x="8" y="16" width="32" height="16" rx="8" stroke="#2563EB" stroke-width="2"/><path d="M18 16v16M30 16v16" stroke="#06B6D4" stroke-width="1.6"/><path d="M14 32v4M34 32v4" stroke="#B8860B" stroke-width="2" stroke-linecap="round"/></svg>';
}

function renderOverview(){
  document.getElementById('h-no').textContent=DATA.projectNo;
  document.getElementById('h-name').textContent=DATA.project;
  document.getElementById('h-sub').textContent='Fabrication progress tracking for every equipment item under Purchase Order '+DATA.po+', supplied by '+DATA.company+' for '+DATA.client+'. Select any equipment tag to explore its full fabrication schedule and current status.';
  const meta=[['Client',DATA.client],['Company',DATA.company],['Supplier W/O',DATA.poDoc],['Schedule Doc',DATA.docSet]];
  document.getElementById('h-meta').innerHTML=meta.map(([k,v])=>`<div class="chip"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('');
  document.getElementById('po-no').textContent=DATA.po;
  document.getElementById('navpo').innerHTML='PO <b>'+esc(DATA.po)+'</b>';

  const tags=DATA.tags;
  const avg=Math.round(tags.reduce((s,t)=>s+t.progress,0)/tags.length);
  const dels=[...new Set(tags.map(t=>t.delivery))];
  const stats=[['Equipment Items',tags.length,''],['Reactors / Vessels',tags.filter(t=>t.tag.includes('-R-')).length,''],
    ['Drums',tags.filter(t=>t.tag.includes('-D-')).length,''],['Avg. Progress',avg+'%','b']];
  document.getElementById('po-stats').innerHTML=stats.map(([l,n,b])=>
    `<div class="po-stat"><div class="n">${b?'<b>'+n+'</b>':n}</div><div class="l">${esc(l)}</div></div>`).join('');

  const cats=[['Reactors &amp; Vessels', tags.filter(t=>t.tag.includes('-R-'))],
              ['Drums', tags.filter(t=>t.tag.includes('-D-'))]];
  document.getElementById('cats').innerHTML=cats.filter(c=>c[1].length).map(([name,list])=>`
    <div class="section-h reveal"><h2>${name}</h2><span class="cnt">${list.length}</span><div class="rule"></div></div>
    <div class="grid">${list.map(cardHTML).join('')}</div>`).join('');
  wireReveal(); wireBars();
}
function cardHTML(t){
  return `<div class="eq-card reveal" onclick="openTag('${t.tag}')">
    <div class="eq-top">
      <div><div class="eq-tag">${esc(t.tag)}</div><div class="eq-type">${esc(typeOf(t.tag))}</div></div>
      ${iconFor(t.tag)}
    </div>
    <div class="eq-meta">
      <div><div class="k">Delivery</div><div class="v">${esc(t.delivery)}</div></div>
      <div><div class="k">Qty</div><div class="v">${esc(t.qty||'1')}</div></div>
      <div><div class="k">Activities</div><div class="v">${t.activities.length}</div></div>
    </div>
    <div class="eq-prog">
      <div class="eq-prog-t"><span class="p">${t.progress}% complete</span><span class="s">as of ${esc(t.dataDate)}</span></div>
      <div class="bar"><i data-w="${t.progress}"></i></div>
    </div>
    <div class="eq-go">View schedule <span class="ar">→</span></div>
  </div>`;
}

/* ── Detail ────────────────────────────────────────────────────────────── */
let curTag=null;
function openTag(tag){
  const t=DATA.tags.find(x=>x.tag===tag); if(!t) return;
  curTag=t;
  document.getElementById('overview').style.display='none';
  const d=document.getElementById('detail'); d.classList.add('on');
  window.scrollTo(0,0);
  document.getElementById('d-tag').textContent=t.tag;
  document.getElementById('d-sub').textContent=typeOf(t.tag)+' · '+DATA.project;
  document.getElementById('crumbs').innerHTML=`<span class="c" onclick="showOverview()">PO ${esc(DATA.po)}</span><span class="sep">/</span><span class="c on">${esc(t.tag)}</span>`;
  document.getElementById('f-doc').textContent=t.doc; document.getElementById('f-rev').textContent=t.rev;

  // ring
  const R=42,C=2*Math.PI*R,off=C*(1-t.progress/100);
  document.getElementById('d-ring').innerHTML=`<svg width="96" height="96"><circle cx="48" cy="48" r="${R}" fill="none" stroke="#EDF0F4" stroke-width="9"/><circle cx="48" cy="48" r="${R}" fill="none" stroke="url(#rg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" id="ring-fg"/><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C8A227"/><stop offset="1" stop-color="#B8860B"/></linearGradient></defs></svg><div class="rt"><b>${t.progress}%</b><span>Complete</span></div>`;
  setTimeout(()=>{const fg=document.getElementById('ring-fg');if(fg)fg.style.transition='stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1)',fg.style.strokeDashoffset=off;},60);

  const meta=[['Delivery',t.delivery,'hl'],['Data Date',t.dataDate,''],['Doc No.',t.doc,''],['Supplier W/O',DATA.poDoc,''],['Qty',t.qty||'1',''],['Activities',t.activities.length,'']];
  document.getElementById('d-meta').innerHTML=meta.map(([k,v,c])=>`<div class="m ${c}"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');

  renderStages(t);
  renderGantt(t);
  renderLegend();
  wireReveal(); wireBars();
}
function showOverview(){
  document.getElementById('detail').classList.remove('on');
  document.getElementById('overview').style.display='block';
  document.getElementById('crumbs').innerHTML='';
  window.scrollTo(0,0);
}

/* Stage summary — the overall process phases with completion */
const PHASES=[
  {n:'Material',codes:['MI']},{n:'Marking / Cutting',codes:['MK','CT']},
  {n:'Forming / Rolling',codes:['FM','RL','RE-ROLL']},{n:'Fit-Up / Welding',codes:['FU','WD']},
  {n:'Heat Treat (PWHT)',codes:['PW','SR']},{n:'Hydro Test',codes:['HT']},
  {n:'Painting',codes:['PA']},{n:'Packing',codes:['PK','PKG']}
];
function renderStages(t){
  const allsteps=[]; t.activities.forEach(a=>a.steps.forEach(s=>allsteps.push(s)));
  const has=code=>allsteps.some(s=>s.code.toUpperCase().split(/[,\s-]+/).includes(code));
  const doneCode=code=>{const xs=allsteps.filter(s=>s.code.toUpperCase().split(/[,\s-]+/).includes(code));return xs.length&&xs.every(s=>s.done);};
  const html=PHASES.filter(p=>p.codes.some(has)).map(p=>{
    const done=p.codes.some(doneCode)&&p.codes.every(c=>!has(c)||doneCode(c));
    return `<div class="stage ${done?'done':''}"><div class="si">${done?'✓ Done':'Planned'}</div><div class="sv">${esc(p.n)}</div></div>`;
  }).join('');
  document.getElementById('d-stages').innerHTML=html;
}

/* Gantt timeline */
function renderGantt(t){
  const g=document.getElementById('gantt');
  const nMonths=WIN.length;
  // months header
  let months=`<div class="g-months"><div class="g-side"></div>`;
  WIN.forEach(w=>{months+=`<div class="g-month"><div class="mm">${MONTHS[w.m]}</div><div class="yy">${w.y}</div><div class="g-days">${'<div class="g-day"></div>'.repeat(6)}</div></div>`;});
  months+=`</div>`;

  // rows grouped
  let rowsHTML=''; let lastGroup=null;
  t.activities.forEach((a,ai)=>{
    if(a.group!==lastGroup){ lastGroup=a.group;
      rowsHTML+=`<div class="g-grouprow"><div class="lbl">${esc(a.group||'')}</div><div style="flex:1"></div></div>`; }
    rowsHTML+=rowHTML(a,ai,t);
  });

  g.innerHTML=months+rowsHTML;

  // draw connectors + nodes per row (after layout)
  requestAnimationFrame(()=>{
    t.activities.forEach((a,ai)=>drawRow(a,ai,t));
    // data-date line + band across the whole track area
    const frac=keyFrac(t.dataKey)/nMonths*100;
    document.querySelectorAll('.g-track').forEach((tr,i)=>{
      const band=document.createElement('div'); band.className='today-band'; band.style.width=frac+'%'; tr.appendChild(band);
      const line=document.createElement('div'); line.className='today-line'+(i===0?'':' no-label'); line.style.left=frac+'%'; tr.appendChild(line);
    });
  });
}
function rowHTML(a,ai,t){
  return `<div class="g-row" data-ai="${ai}">
    <div class="r-side"><div class="rn">${esc(a.name)}</div><div class="rc">${a.steps.length} steps</div></div>
    <div class="g-track" id="trk-${ai}">
      <div class="g-cellgrid">${'<div class="gm"></div>'.repeat(WIN.length)}</div>
      <svg class="g-svg" id="svg-${ai}" preserveAspectRatio="none"></svg>
    </div></div>`;
}
function drawRow(a,ai,t){
  const trk=document.getElementById('trk-'+ai); if(!trk)return;
  const W=trk.clientWidth, H=trk.clientHeight, cy=H/2, nMonths=WIN.length;
  const xOf=s=>keyFrac(s.k)/nMonths*W;
  const svg=document.getElementById('svg-'+ai); svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  let paths='';
  for(let i=0;i<a.steps.length-1;i++){
    const x1=xOf(a.steps[i]),x2=xOf(a.steps[i+1]);
    const done=a.steps[i+1].done;
    paths+=`<path class="flow ${done?'done':'pend'}" d="M${x1} ${cy} L${x2} ${cy}"/>`;
    if(done) paths+=`<path class="flow-pulse" pathLength="1" style="stroke:var(--done)" d="M${x1} ${cy} L${x2} ${cy}"/>`;
  }
  svg.innerHTML=paths;
  // nodes
  a.steps.forEach((s,i)=>{
    const x=xOf(s), isPk=/PK/i.test(s.code);
    const n=document.createElement('div'); n.className='node'+(isPk?' pk':''); n.style.left=x+'px'; n.style.top=cy+'px';
    n.innerHTML=`<div class="dot ${s.done?'done':'pend'}"></div><div class="nlab">${esc(s.code)}</div>`;
    n.addEventListener('mouseenter',e=>showTip(e,a,s));
    n.addEventListener('mousemove',moveTip);
    n.addEventListener('mouseleave',hideTip);
    trk.appendChild(n);
  });
}
const tip=document.getElementById('tip');
function showTip(e,a,s){
  tip.innerHTML=`<div class="tt">${esc(s.label||s.code)}</div><div class="td">${esc(a.name)} · ${esc(a.group||'')}</div><div class="ts ${s.done?'done':'pend'}">${s.done?'✓ Completed':'○ Planned'} · ${esc(s.date)} 20${s.m>=7?'26':'27'}</div>`;
  tip.classList.add('show'); moveTip(e);
}
function moveTip(e){
  let x=e.clientX+14,y=e.clientY+14;
  if(x+250>innerWidth)x=e.clientX-250; if(y+80>innerHeight)y=e.clientY-80;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip(){tip.classList.remove('show');}

function renderLegend(){
  document.getElementById('legend').innerHTML=Object.entries(DATA.legend).map(([k,v])=>
    `<div class="li"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('');
}

/* reveal + bars */
function wireReveal(){
  const io=new IntersectionObserver((es)=>{es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}});},{threshold:.12});
  document.querySelectorAll('.reveal:not(.in)').forEach(el=>io.observe(el));
}
function wireBars(){
  const io=new IntersectionObserver((es)=>{es.forEach(en=>{if(en.isIntersecting){const i=en.target;i.style.width=(i.dataset.w||0)+'%';io.unobserve(i);}});},{threshold:.4});
  document.querySelectorAll('.bar>i').forEach(el=>io.observe(el));
}

window.openTag=openTag; window.showOverview=showOverview;
renderOverview();
window.addEventListener('resize',()=>{ if(curTag && document.getElementById('detail').classList.contains('on')){ renderGantt(curTag);} });
})();
</script>
