<g transform="translate(810.0,214)"><rect x="-92" y="-18" width="184" height="26" rx="13" fill="#fdecec" stroke="#d64545"/><text x="0" y="-1" text-anchor="middle" font-size="12" font-weight="700" fill="#d64545">🔒 TRUST BOUNDARY</text></g>
<line x1="286" y1="137.0" x2="298" y2="137.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arw)" />
<line x1="544" y1="137.0" x2="556" y2="137.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arw)" />
<line x1="802" y1="137.0" x2="814" y2="137.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arw)" />
<line x1="1060" y1="137.0" x2="1072" y2="137.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arw)" />
