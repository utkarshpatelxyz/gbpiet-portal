<line x1="452" y1="799.0" x2="472" y2="799.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arw)" />
<line x1="668" y1="799.0" x2="688" y2="799.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arw)" />
<line x1="884" y1="799.0" x2="904" y2="799.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arw)" />
<line x1="1100" y1="799.0" x2="1120" y2="799.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arw)" />
<line x1="1316" y1="799.0" x2="1336" y2="799.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arw)" />
<rect x="40" y="26" width="1540" height="58" rx="12" fill="#eef4ff" stroke="#1d4ed8" stroke-width="1.3"/><text x="66" y="60" font-size="21" font-weight="800" fill="#12234a">From Problem Statement to a Self-Configuring, Zero-Leak Screening Tool</text><text x="67" y="78.0" font-size="12.5" fill="#3b5a86" text-anchor="start" font-weight="400">Method &amp; reference architecture  ·  how one tool serves any department without ever holding its data</text>
<rect x="40" y="104" width="246" height="66" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><circle cx="58" cy="124" r="10" fill="#2563eb"/><text x="58" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text><text x="76" y="129" font-size="13" font-weight="700" fill="#2563eb">Frame the problem</text><text x="56" y="149.0" font-size="10.5" fill="#5b6675" text-anchor="start" font-weight="400">name the decision + its hidden framework</text>
<rect x="298" y="104" width="246" height="66" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><circle cx="316" cy="124" r="10" fill="#2563eb"/><text x="316" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text><text x="334" y="129" font-size="13" font-weight="700" fill="#2563eb">Separate data from logic</text><text x="314" y="149.0" font-size="10.5" fill="#5b6675" text-anchor="start" font-weight="400">what is Tool vs what is Confidential Data</text>
<rect x="556" y="104" width="246" height="66" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><circle cx="574" cy="124" r="10" fill="#2563eb"/><text x="574" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text><text x="592" y="129" font-size="13" font-weight="700" fill="#2563eb">Build the tool</text><text x="572" y="149.0" font-size="10.5" fill="#5b6675" text-anchor="start" font-weight="400">fixed engine + UI + config loader + report builder</text>
<rect x="814" y="104" width="246" height="66" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><circle cx="832" cy="124" r="10" fill="#2563eb"/><text x="832" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text><text x="850" y="129" font-size="13" font-weight="700" fill="#2563eb">Configure</text><text x="830" y="149.0" font-size="10.5" fill="#5b6675" text-anchor="start" font-weight="400">department fills the config workbook — not the tool</text>
<rect x="1072" y="104" width="246" height="66" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><circle cx="1090" cy="124" r="10" fill="#2563eb"/><text x="1090" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">5</text><text x="1108" y="129" font-size="13" font-weight="700" fill="#2563eb">Run a session</text><text x="1088" y="149.0" font-size="10.5" fill="#5b6675" text-anchor="start" font-weight="400">upload · analyse · export, all in the browser</text>
<rect x="1330" y="104" width="246" height="66" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/><circle cx="1348" cy="124" r="10" fill="#2563eb"/><text x="1348" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">6</text><text x="1366" y="129" font-size="13" font-weight="700" fill="#2563eb">Reset</text><text x="1346" y="149.0" font-size="10.5" fill="#5b6675" text-anchor="start" font-weight="400">refresh wipes framework + resumes</text>
<rect x="40" y="232" width="720" height="498" rx="12" fill="#eef4ff" stroke="#1d4ed8" stroke-width="2"/><text x="62" y="262" font-size="15" font-weight="800" fill="#1d4ed8">THE TOOL   ·   this single HTML file</text><text x="62" y="282.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">Ships with ZERO framework. Identical for every customer. Shareable and demoable.</text>
<rect x="860" y="232" width="720" height="498" rx="12" fill="#fdf3e3" stroke="#b45309" stroke-width="2"/><text x="882" y="262" font-size="15" font-weight="800" fill="#b45309">CONFIDENTIAL DATA   ·   stays yours</text><text x="882" y="282.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">Never written into the tool. Lives only in browser memory during a session.</text>
<rect x="66" y="324" width="320" height="150" rx="9" fill="#ffffff" stroke="#cfd7e3" stroke-width="1.3"/><text x="82" y="349" font-size="13.5" font-weight="700" fill="#1f2733">Fixed engine  [ENGINE]</text><text x="82" y="369.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">• PDF text extraction + on-device OCR</text><text x="82" y="386.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">• Date / experience reconciliation</text><text x="82" y="403.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">• Generic keyword scoring (PCI)</text><text x="82" y="420.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">• Best-fit level + screening flags</text><text x="82" y="437.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">No company data. Same for all.</text>
<rect x="410" y="324" width="324" height="150" rx="9" fill="#ffffff" stroke="#cfd7e3" stroke-width="1.3"/><text x="426" y="349" font-size="13.5" font-weight="700" fill="#1f2733">User interface  [UI]</text><text x="426" y="369.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">• 3-step wizard: load → add → review</text><text x="426" y="386.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">• Enterprise dashboard + tables</text><text x="426" y="403.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">• Experience audit (reviewer edits)</text><text x="426" y="420.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">• In-memory only; reset button</text>
<rect x="66" y="496" width="320" height="200" rx="9" fill="#ffffff" stroke="#cfd7e3" stroke-width="1.3"/><text x="82" y="521" font-size="13.5" font-weight="700" fill="#1f2733">Config loader  [CONFIG]</text><text x="82" y="541.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">Reads the uploaded workbook and</text><text x="82" y="558.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">builds the in-memory framework:</text><text x="82" y="575.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">levels · skills · scoring · questions.</text><text x="82" y="592.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">The ONLY bridge between the</text><text x="82" y="609.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">tool and your data. Strict, with</text><text x="82" y="626.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">clear validation errors.</text>
<rect x="410" y="496" width="324" height="200" rx="9" fill="#ffffff" stroke="#cfd7e3" stroke-width="1.3"/><text x="426" y="521" font-size="13.5" font-weight="700" fill="#1f2733">Report builder  [CONFIG]</text><text x="426" y="541.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">Generates the evaluation kit LIVE</text><text x="426" y="558.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">from the loaded framework.</text><text x="426" y="575.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">No confidential template is baked</text><text x="426" y="592.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">into the tool — the kit format</text><text x="426" y="609.0" font-size="11.5" fill="#5b6675" text-anchor="start" font-weight="400">comes from your workbook.</text>
<rect x="886" y="324" width="668" height="168" rx="9" fill="#ffffff" stroke="#cfd7e3" stroke-width="1.3"/><text x="902" y="349" font-size="14" font-weight="700" fill="#1f2733">Configuration workbook  (.xlsx template you fill)</text><text x="902" y="369.0" font-size="12" fill="#5b6675" text-anchor="start" font-weight="400">Setup  ·  Levels  ·  Technical Skills  ·  Behavioral  ·  Competencies  ·  Questions</text><text x="902" y="386.5" font-size="12" fill="#5b6675" text-anchor="start" font-weight="400">Mirrors the Master-Skills format. Yellow sample cells → replace with your framework.</text><text x="902" y="404.0" font-size="12" fill="#5b6675" text-anchor="start" font-weight="400">You keep this file. Upload it to run; it is never stored by the tool.</text>
<rect x="886" y="516" width="668" height="176" rx="9" fill="#ffffff" stroke="#cfd7e3" stroke-width="1.3"/><text x="902" y="541" font-size="14" font-weight="700" fill="#1f2733">Resumes  (PDF)</text><text x="902" y="561.0" font-size="12" fill="#5b6675" text-anchor="start" font-weight="400">Uploaded per session, parsed in the browser (text layer or OCR).</text><text x="902" y="578.5" font-size="12" fill="#5b6675" text-anchor="start" font-weight="400">Held in memory as extracted text only. Never uploaded anywhere.</text><text x="902" y="596.0" font-size="12" fill="#5b6675" text-anchor="start" font-weight="400">Erased with everything else on refresh / close / Reset.</text>
<rect x="40" y="762" width="196" height="74" rx="9" fill="#eef4ff" stroke="#2563eb" stroke-width="1.3"/><text x="138.0" y="804" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">Open the tool</text>
<rect x="256" y="762" width="196" height="74" rx="9" fill="#eef4ff" stroke="#2563eb" stroke-width="1.3"/><text x="354.0" y="792" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">Upload config</text><text x="354.0" y="808" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">(in memory)</text>
<rect x="472" y="762" width="196" height="74" rx="9" fill="#eef4ff" stroke="#2563eb" stroke-width="1.3"/><text x="570.0" y="792" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">Upload resumes</text><text x="570.0" y="808" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">(in memory)</text>
<rect x="688" y="762" width="196" height="74" rx="9" fill="#eef4ff" stroke="#2563eb" stroke-width="1.3"/><text x="786.0" y="792" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">Analyse</text><text x="786.0" y="808" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">(fixed engine)</text>
<rect x="904" y="762" width="196" height="74" rx="9" fill="#eef4ff" stroke="#2563eb" stroke-width="1.3"/><text x="1002.0" y="804" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">Review dashboard</text>
<rect x="1120" y="762" width="196" height="74" rx="9" fill="#eef4ff" stroke="#2563eb" stroke-width="1.3"/><text x="1218.0" y="792" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">Export kit</text><text x="1218.0" y="808" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">(built from config)</text>
<rect x="1336" y="762" width="196" height="74" rx="9" fill="#fdecec" stroke="#d64545" stroke-width="1.3"/><text x="1434.0" y="792" font-size="12" fill="#d64545" text-anchor="middle" font-weight="700">Refresh ⇒ ERASE</text><text x="1434.0" y="808" font-size="12" fill="#d64545" text-anchor="middle" font-weight="700">framework + resumes</text>
<rect x="40" y="866" width="1540" height="92" rx="12" fill="#f8fafc" stroke="#cfd7e3" stroke-width="1.3"/><text x="56" y="891" font-size="14" font-weight="700" fill="#1f2733">Data-sensitivity boundary</text><text x="56" y="911.0" font-size="12" fill="#5b6675" text-anchor="start" font-weight="400">The dashed boundary is the trust line. Left of it = code that carries no data and can be shared freely.</text><text x="56" y="928.5" font-size="12" fill="#5b6675" text-anchor="start" font-weight="400">Right of it = your framework and the resumes, which exist only in this browser tab and are wiped on refresh.</text><text x="56" y="946.0" font-size="12" fill="#5b6675" text-anchor="start" font-weight="400">There is no server, no upload, no database, no localStorage for any confidential data — separation is structural, not a policy.</text>
</svg>