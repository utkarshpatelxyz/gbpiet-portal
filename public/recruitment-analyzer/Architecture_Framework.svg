<line x1="1220.0" y1="516" x2="226.0" y2="474" stroke="#b45309" stroke-width="1.8" marker-end="url(#arwR)" stroke-dasharray="6 4"/>
<rect x="705.0" y="479.0" width="36" height="16" rx="8" fill="#fff" stroke="#b45309"/><text x="723.0" y="491.0" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">read</text>
